<script>

// ===== 00_core.js =====
// 00_core — RNG registry, palette, clock, shared helpers. Owner: core.
'use strict';

// ---------- seeded RNG (no Math.random anywhere in this project) ----------
function hashStr(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19);} return (h>>>0); }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

class Rand {
  constructor(seed){ this.state = (typeof seed==='string'? hashStr(seed): seed)>>>0; }
  next(){ this.state=(this.state+0x6D2B79F5)|0; let t=Math.imul(this.state^(this.state>>>15),1|this.state); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }
  int(a,b){ return a+Math.floor(this.next()*(b-a+1)); }        // inclusive
  pick(arr){ return arr[Math.floor(this.next()*arr.length)]; }
  chance(p){ return this.next()<p; }
  roll(n,d,plus=0){ let s=plus; for(let i=0;i<n;i++) s+=this.int(1,d); return s; }
}

// Persistent named streams. Streams live for the session; states are saved &
// restored so reload can't be used to reroll outcomes (rest ambushes etc).
const RNG = {
  streams:{},
  worldSeed:'vintavia-1',
  get(name){ if(!this.streams[name]) this.streams[name]=new Rand(this.worldSeed+':'+name); return this.streams[name]; },
  world(name){ return new Rand(this.worldSeed+':world:'+name); }, // derivation-only: layout must be identical every run
  serialize(){ const o={}; for(const k in this.streams) o[k]=this.streams[k].state; return o; },
  restore(o){ for(const k in o){ this.get(k).state=o[k]>>>0; } },
  reset(){ this.streams={}; }
};

// ---------- palette: 256 colors, 16 ramps x 16 shades ----------
// Ramp hues tuned for 1998 MM6 earth-and-stone look.
const PAL = new Uint8Array(256*3);
(function buildPalette(){
  const ramps = [
    [ 20, 18, 22, 235,230,224], // 0 gray/stone
    [ 24, 14,  8, 214,168,110], // 1 brown/wood
    [ 10, 20,  8, 150,210,120], // 2 green/grass
    [  8, 12, 30, 130,170,235], // 3 blue/sky-water
    [ 28,  6,  4, 240,120, 80], // 4 red/fire
    [ 30, 22,  4, 250,214, 96], // 5 gold
    [ 16,  6, 24, 200,140,230], // 6 purple/magic
    [ 26, 16, 10, 250,205,170], // 7 skin
    [  6, 16, 18, 120,220,210], // 8 teal
    [ 18, 20,  6, 200,210,110], // 9 olive
    [ 30, 12, 16, 250,150,170], //10 rose
    [  8,  8, 12, 150,150,180], //11 slate
    [ 22, 10,  2, 235,140, 40], //12 orange
    [  4, 18,  6,  80,180, 70], //13 deep green
    [ 12,  4,  4, 190, 60, 50], //14 blood
    [  2,  2,  4, 255,255,255], //15 black->white
  ];
  for(let r=0;r<16;r++){
    const [r0,g0,b0,r1,g1,b1]=ramps[r];
    for(let s=0;s<16;s++){
      const t=s/15, u=Math.pow(t,0.85);
      const i=(r*16+s)*3;
      PAL[i  ]=Math.round(r0+(r1-r0)*u);
      PAL[i+1]=Math.round(g0+(g1-g0)*u);
      PAL[i+2]=Math.round(b0+(b1-b0)*u);
    }
  }
})();
const PAL32 = new Uint32Array(256);
(function(){ for(let i=0;i<256;i++){ PAL32[i]=(255<<24)|(PAL[i*3+2]<<16)|(PAL[i*3+1]<<8)|PAL[i*3]; } })();

const _nearCache = new Map();
function palNearest(r,g,b){
  const key=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
  let v=_nearCache.get(key); if(v!==undefined) return v;
  let best=0,bd=1e9;
  for(let i=0;i<256;i++){ const dr=PAL[i*3]-r,dg=PAL[i*3+1]-g,db=PAL[i*3+2]-b; const d=dr*dr*2+dg*dg*3+db*db; if(d<bd){bd=d;best=i;} }
  _nearCache.set(key,best); return best;
}
// ordered 4x4 Bayer dither: returns palette index for (r,g,b) at pixel (x,y)
const BAYER4=[0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
function palDither(r,g,b,x,y,amt=14){
  const t=(BAYER4[(y&3)*4+(x&3)]/16-0.5)*amt;
  return palNearest(Math.max(0,Math.min(255,r+t)),Math.max(0,Math.min(255,g+t)),Math.max(0,Math.min(255,b+t)));
}
// ramp shade: ramp 0..15, shade 0..15
function palIdx(ramp,shade){ return (ramp<<4)|Math.max(0,Math.min(15,shade|0)); }

// ---------- clock (canonical: total game minutes) ----------
const Clock = {
  START: 8*60, // Day 1, 08:00
  MONTHS:['Newleaf','Suncrest','Harvestide','Embermoon'],
  DAYS:['Moonday','Tirsday','Wodesday','Thorsday','Freyday','Sterday','Sunday'],
  parts(min){
    const day=Math.floor(min/1440), h=Math.floor((min%1440)/60), m=min%60;
    return { day:day+1, hour:h, min:m,
      dayName:this.DAYS[day%7], month:this.MONTHS[Math.floor(day/28)%4], dom:(day%28)+1,
      hhmm:(h<10?'0':'')+h+':'+(m<10?'0':'')+m,
      isNight: h<5||h>=21, isDusk: h>=19&&h<21, isDawn: h>=5&&h<7 };
  },
  lightLevel(min){ // 0..1 ambient daylight (gentle dawn/dusk ramps)
    const h=(min%1440)/60;
    if(h>=7&&h<18) return 1;
    if(h>=5&&h<7) return 0.12+(h-5)/2*0.88;
    if(h>=18&&h<21) return 1-(h-18)/3*0.88;
    return 0.12;
  }
};

// ---------- helpers ----------
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function dist2(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return dx*dx+dy*dy; }
function angTo(ax,ay,bx,by){ return Math.atan2(by-ay,bx-ax); }
function angDiff(a,b){ let d=(b-a)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }

// tiny event bus for UI <-> game decoupling
const Bus = {
  h:{},
  on(ev,fn){ (this.h[ev]=this.h[ev]||[]).push(fn); },
  emit(ev,...a){ const l=this.h[ev]; if(l) for(const f of l) f(...a); }
};

// message log (single writer; UI reads)
const Log = {
  lines:[],
  add(text,color){ this.lines.push({text,color:color||palIdx(0,13),t:performance.now()}); if(this.lines.length>60) this.lines.shift(); Bus.emit('log',text); },
};

// ===== 01_rules.js =====
// 01_rules — PURE rules engine. No DOM, no rendering, no game-state reads.
// Every formula in the game lives here. Glue calls these; it never re-derives.
'use strict';

const ATTRS=['might','intellect','personality','endurance','accuracy','speed','luck'];

const Rules = {};

// MM6-style attribute modifier breakpoints
Rules.statMod = function(v){
  if(v>=100) return 15; if(v>=75) return 13; if(v>=50) return 11; if(v>=40) return 10;
  if(v>=35) return 9; if(v>=30) return 8; if(v>=25) return 7; if(v>=21) return 6;
  if(v>=19) return 5; if(v>=17) return 4; if(v>=15) return 3; if(v>=13) return 2;
  if(v>=11) return 1; if(v>=9) return 0; if(v>=7) return -1; if(v>=5) return -2;
  if(v>=3) return -3; return -4;
};

// ---------- classes ----------
const CLASSES = {
  knight:  { name:'Knight',   hpBase:40, hpLv:7, spLv:0, spStat:null,          weapons:['sword','axe','mace','dagger','bow','staff'], armor:['leather','chain','plate','shield'], schools:[], startSkills:['sword','bodybuilding','shield','leather'] },
  paladin: { name:'Paladin',  hpBase:34, hpLv:6, spLv:2, spStat:'personality', weapons:['sword','mace','dagger','bow'], armor:['leather','chain','plate','shield'], schools:['spirit','mind','body'], startSkills:['mace','spirit','shield','leather'] },
  archer:  { name:'Archer',   hpBase:30, hpLv:5, spLv:2, spStat:'intellect',   weapons:['bow','sword','dagger','axe'], armor:['leather','chain'], schools:['fire','air','water','earth'], startSkills:['bow','air','sword','leather'] },
  cleric:  { name:'Cleric',   hpBase:26, hpLv:4, spLv:3, spStat:'personality', weapons:['mace','staff'], armor:['leather','chain','shield'], schools:['spirit','mind','body','light','dark'], startSkills:['mace','body','spirit','leather'] },
  sorcerer:{ name:'Sorcerer', hpBase:20, hpLv:3, spLv:4, spStat:'intellect',   weapons:['dagger','staff','bow'], armor:['leather'], schools:['fire','air','water','earth','light','dark'], startSkills:['fire','staff','air','leather'] },
  druid:   { name:'Druid',    hpBase:24, hpLv:4, spLv:3, spStat:'both',        weapons:['dagger','mace','staff'], armor:['leather'], schools:['fire','air','water','earth','spirit','mind','body'], startSkills:['earth','body','dagger','leather'] },
};
const CLASS_BASE_STATS = { // point-buy baseline per class
  knight:  {might:14,intellect: 7,personality: 9,endurance:14,accuracy:11,speed:11,luck: 9},
  paladin: {might:12,intellect: 7,personality:12,endurance:12,accuracy:10,speed:10,luck: 9},
  archer:  {might:11,intellect:11,personality: 7,endurance:10,accuracy:13,speed:12,luck: 9},
  cleric:  {might: 9,intellect: 9,personality:14,endurance:11,accuracy: 9,speed:10,luck: 9},
  sorcerer:{might: 7,intellect:14,personality: 9,endurance: 9,accuracy:11,speed:11,luck:10},
  druid:   {might: 9,intellect:12,personality:12,endurance:10,accuracy: 9,speed:10,luck: 9},
};
Rules.POINT_POOL=12; Rules.STAT_MIN=5; Rules.STAT_MAX=25;
Rules.pointCost=function(from,to){ // cost to raise a stat 1 step at value `from`
  return from>=17?2:1; };
Rules.canRaise=(pc,attr,pool)=>pc.stats[attr]<Rules.STAT_MAX&&pool>=Rules.pointCost(pc.stats[attr]);
Rules.canLower=(cls,pc,attr)=>pc.stats[attr]>Rules.STAT_MIN&&pc.stats[attr]>CLASS_BASE_STATS[cls][attr]-4;

// ---------- skills ----------
// rank: 0 none, then points 1..; tier: novice(>=1) expert(>=4) master(>=7)
const SKILLS = {
  sword:{name:'Sword',type:'weapon'}, axe:{name:'Axe',type:'weapon'}, mace:{name:'Mace',type:'weapon'},
  dagger:{name:'Dagger',type:'weapon'}, bow:{name:'Bow',type:'weapon'}, staff:{name:'Staff',type:'weapon'},
  leather:{name:'Leather',type:'armor'}, chain:{name:'Chain',type:'armor'}, plate:{name:'Plate',type:'armor'}, shield:{name:'Shield',type:'armor'},
  bodybuilding:{name:'Bodybuilding',type:'misc'}, meditation:{name:'Meditation',type:'misc'},
  merchant:{name:'Merchant',type:'misc'}, perception:{name:'Perception',type:'misc'}, disarm:{name:'Disarm Traps',type:'misc'}, learning:{name:'Learning',type:'misc'},
  fire:{name:'Fire Magic',type:'magic'}, air:{name:'Air Magic',type:'magic'}, water:{name:'Water Magic',type:'magic'}, earth:{name:'Earth Magic',type:'magic'},
  spirit:{name:'Spirit Magic',type:'magic'}, mind:{name:'Mind Magic',type:'magic'}, body:{name:'Body Magic',type:'magic'},
  light:{name:'Light Magic',type:'magic'}, dark:{name:'Dark Magic',type:'magic'},
};
Rules.skillTier=function(pts){ return pts>=7?'master':pts>=4?'expert':pts>=1?'novice':'none'; };
Rules.skillTierMult=function(pts){ return pts>=7?3:pts>=4?2:pts>=1?1:0; };
Rules.skillUpCost=function(curPts){ return (curPts+1)*60; }; // gold at guild
Rules.SKILL_LEARN_COST=100; // gold to learn a new class-legal skill at the trainer
Rules.canLearnSkill=function(cls,skill){
  const c=CLASSES[cls], s=SKILLS[skill];
  if(!s) return false;
  if(s.type==='weapon') return c.weapons.includes(skill);
  if(s.type==='armor') return c.armor.includes(skill);
  if(s.type==='magic') return c.schools.includes(skill);
  return true;
};

// ---------- derived stats ----------
Rules.maxHP=function(pc){
  const c=CLASSES[pc.cls];
  const bb=(pc.skills.bodybuilding||0);
  return Math.max(1, c.hpBase + (pc.level-1)*c.hpLv + Rules.statMod(pc.stats.endurance)*pc.level + bb*Rules.skillTierMult(bb)*2);
};
Rules.maxSP=function(pc){
  const c=CLASSES[pc.cls];
  if(!c.spLv) return 0;
  let stat;
  if(c.spStat==='both') stat=Math.round((pc.stats.intellect+pc.stats.personality)/2);
  else stat=pc.stats[c.spStat];
  const med=(pc.skills.meditation||0);
  return Math.max(0, 4 + pc.level*c.spLv + Rules.statMod(stat)*pc.level + med*Rules.skillTierMult(med)*2);
};
Rules.armorClass=function(pc,items){ // items: resolved equip item defs (ITEMS[id])
  let ac=Rules.statMod(pc.stats.speed);
  for(const it of items){ if(!it||!it.ac) continue;
    const sk=(pc.skills[it.skill]||0);
    ac+=it.ac + (it.skill?sk:0);
  }
  return Math.max(0,ac);
};
Rules.attackBonus=function(pc,weapon){ // weapon: item def or null (fists); accuracy governs all to-hit
  const sk=weapon?(pc.skills[weapon.skill]||0):0;
  return Rules.statMod(pc.stats.accuracy)+sk+(weapon&&weapon.bonusHit||0);
};
Rules.damageRange=function(pc,weapon){
  const m=Rules.statMod(weapon&&weapon.skill==='bow'?pc.stats.accuracy:pc.stats.might);
  const sk=weapon?(pc.skills[weapon.skill]||0):0;
  const tier=Rules.skillTierMult(sk);
  if(!weapon) return {n:1,d:2,plus:Math.max(0,m)};
  return {n:weapon.dn,d:weapon.dd,plus:(weapon.dp||0)+Math.max(0,m)+ (tier>=2?sk:0)};
};
Rules.recoveryMs=function(pc,weapon){ // ms between attacks in real-time
  const base=weapon?weapon.rec:1800;
  const sp=Rules.statMod(pc.stats.speed);
  return clamp(base-sp*60,600,3000);
};

// ---------- combat math ----------
// hit chance vs AC (MM6-flavored): 2d + bonus vs AC
Rules.hitChance=function(bonus,ac){ return clamp((20+2*bonus-ac)/(30+2*bonus),0.05,0.95); };
Rules.attackRoll=function(rand,attacker_bonus,defender_ac){ return rand.next()<Rules.hitChance(attacker_bonus,defender_ac); };
Rules.damageRoll=function(rand,range){ return Math.max(1,rand.roll(range.n,range.d,range.plus)); };
Rules.monsterHit=function(rand,mAtk,pcAC){ return rand.next()<Rules.hitChance(mAtk,pcAC); };

// ---------- XP / leveling ----------
Rules.xpForLevel=function(lv){ return lv*(lv-1)*500; }; // total xp needed to BE level lv
Rules.canTrain=function(pc){ return pc.xp>=Rules.xpForLevel(pc.level+1); };
Rules.trainCost=function(level){ return level*25; }; // cost to train TO level+1 given current level
Rules.levelUpGains=function(pc){ // returns {hp, sp} gained — applied by caller via maxHP/maxSP recompute
  return {level:pc.level+1};
};
Rules.xpShare=function(total,partySize){ return Math.ceil(total/Math.max(1,partySize)); };

// ---------- economy ----------
Rules.buyPrice=function(base,merchantPts){ const t=Rules.skillTierMult(merchantPts||0); const mult=[1.5,1.25,1.1,1.0][Math.min(3,t)]; return Math.max(1,Math.round(base*mult)); };
Rules.sellPrice=function(base,merchantPts){ const t=Rules.skillTierMult(merchantPts||0); const mult=[0.4,0.55,0.7,0.85][Math.min(3,t)]; return Math.max(1,Math.round(base*mult)); };
Rules.templeHealCost=function(pc){ // heal all hp + cure conditions
  let c=10+pc.level*5;
  if(pc.cond==='dead') c+=100+pc.level*20;
  else if(pc.cond==='poisoned'||pc.cond==='diseased') c+=25;
  return c;
};
Rules.tavernRestCost=function(partyLevelSum){ return 10+partyLevelSum*2; };
// bank is safe storage only — no interest, no fees

// ---------- resting ----------
Rules.REST_MINUTES=8*60;
Rules.restResult=function(pc){ // full hp/sp unless dead/diseased; returns new cond
  if(pc.cond==='dead') return {hp:0,sp:0,cond:'dead'};
  if(pc.cond==='diseased') return {hp:Math.ceil(Rules.maxHP(pc)*0.5),sp:Math.ceil(Rules.maxSP(pc)*0.5),cond:'diseased'};
  const cond=(pc.cond==='poisoned')?'poisoned':'ok';
  const f=cond==='poisoned'?0.6:1;
  return {hp:Math.ceil(Rules.maxHP(pc)*f),sp:Math.ceil(Rules.maxSP(pc)*f),cond};
};
Rules.outdoorAmbushChance=0.25;

// ---------- chest traps (Disarm Traps skill finally earns its keep) ----------
Rules.trapChance=function(tier){ return clamp(0.15+tier*0.15,0,0.7); };
Rules.trapDamage=function(rand,tier){ return rand.roll(2,4,tier*3); };
Rules.disarmed=function(rand,bestDisarm,tier){ // roll best party skill vs chest tier
  return rand.next() < clamp(0.25+bestDisarm*0.12-tier*0.08,0.05,0.97);
};

// ---------- conditions (poison ticks etc) ----------
Rules.poisonTick=function(pc){ return Math.max(1,Math.round(pc.level/2)); }; // hp lost per game hour
Rules.conditionColor=function(cond){ return cond==='ok'?palIdx(2,13):cond==='poisoned'?palIdx(13,10):cond==='diseased'?palIdx(9,9):cond==='unconscious'?palIdx(5,10):palIdx(14,8); };

// ---------- buff-aware effective stats (single source; glue passes party.buffs) ----------
Rules.effectiveAttack=function(pc,weapon,buffs){
  let b=Rules.attackBonus(pc,weapon);
  if(buffs&&buffs.bless) b+=buffs.bless.hitBonus||3;
  return b;
};
Rules.effectiveDamage=function(pc,weapon,buffs){
  const r=Rules.damageRange(pc,weapon);
  if(buffs&&buffs.heroism) r.plus+=buffs.heroism.dmgBonus||3;
  return r;
};
Rules.effectiveAC=function(pc,equipDefs,buffs){
  let ac=Rules.armorClass(pc,equipDefs);
  if(buffs&&buffs.stoneskin) ac+=buffs.stoneskin.acBonus||5;
  return ac;
};
Rules.effectiveRecovery=function(pc,weapon,buffs){
  let ms=Rules.recoveryMs(pc,weapon);
  if(buffs&&buffs.haste) ms=Math.round(ms*0.7);
  return ms;
};

// ---------- party creation ----------
Rules.makePC=function(name,cls,portrait,stats){
  const pc={ name, cls, portrait, level:1, xp:0,
    stats:Object.assign({},stats||CLASS_BASE_STATS[cls]),
    skills:{}, spells:[], cond:'ok',
    equip:{weapon:null,shield:null,armor:null,helm:null,boots:null,ring1:null,ring2:null,amulet:null},
    items:new Array(48).fill(null), skillPoints:0 };
  for(const s of CLASSES[cls].startSkills) pc.skills[s]=1;
  pc.hp=0; pc.sp=0; // caller sets to max via recompute
  return pc;
};
Rules.RECOMMENDED=[
  ['Roderic','knight',0],['Aldric','paladin',1],['Serena','cleric',2],['Mireth','sorcerer',3],
];

// ===== 02_spells.js =====
// 02_spells — PURE spell definitions and resolvers. Owner: spells.
// castSpell() computes an effect description; the game layer applies it.
'use strict';

// target: 'enemy' (needs monster target), 'party', 'pc' (needs party member), 'self', 'world'
const SPELLS = {
  // FIRE
  fire_bolt:   {school:'fire', name:'Fire Bolt',    sp:2,  req:1, target:'enemy', kind:'damage', n:1,d:4, perSkill:1, proj:'fire'},
  fire_ball:   {school:'fire', name:'Fireball',     sp:8,  req:4, target:'enemy', kind:'damage', n:3,d:6, perSkill:2, proj:'fire', aoe:2.2},
  fire_haste:  {school:'fire', name:'Haste',        sp:5,  req:2, target:'party', kind:'buff', buff:'haste', durMin:30, perSkillDur:10},
  // AIR
  air_spark:   {school:'air',  name:'Static Charge',sp:2,  req:1, target:'enemy', kind:'damage', n:1,d:5, perSkill:1, proj:'spark'},
  air_shield:  {school:'air',  name:'Wizard Eye',   sp:3,  req:1, target:'world', kind:'wizardEye', durMin:60},
  air_bolt:    {school:'air',  name:'Lightning Bolt',sp:9, req:4, target:'enemy', kind:'damage', n:4,d:5, perSkill:2, proj:'spark'},
  // WATER
  water_splash:{school:'water',name:'Ice Shard',    sp:3,  req:1, target:'enemy', kind:'damage', n:1,d:6, perSkill:1, proj:'ice'},
  water_walk:  {school:'water',name:'Cold Ward',    sp:4,  req:2, target:'party', kind:'buff', buff:'ward', durMin:40, perSkillDur:10},
  water_blast: {school:'water',name:'Frost Nova',   sp:10, req:4, target:'enemy', kind:'damage', n:3,d:7, perSkill:2, proj:'ice', aoe:2.0},
  // EARTH
  earth_stone: {school:'earth',name:'Stone Dart',   sp:2,  req:1, target:'enemy', kind:'damage', n:1,d:5, perSkill:1, proj:'stone'},
  earth_skin:  {school:'earth',name:'Stoneskin',    sp:4,  req:2, target:'party', kind:'buff', buff:'stoneskin', durMin:40, perSkillDur:10, acBonus:5},
  earth_quake: {school:'earth',name:'Rock Blast',   sp:9,  req:4, target:'enemy', kind:'damage', n:3,d:6, perSkill:2, proj:'stone', aoe:1.8},
  // SPIRIT
  spirit_bless:{school:'spirit',name:'Bless',       sp:3,  req:1, target:'party', kind:'buff', buff:'bless', durMin:30, perSkillDur:10, hitBonus:3},

const Spellcraft = {
  known(pc){ return pc.spells.map(id=>SPELLS[id]).filter(Boolean); },
  canCast(pc,id){
    const s=SPELLS[id]; if(!s) return {ok:false,why:'Unknown spell'};
    if(!pc.spells.includes(id)) return {ok:false,why:'Spell not learned'};
    const sk=pc.skills[s.school]||0;
    if(sk<s.req) return {ok:false,why:'Requires '+SKILLS[s.school].name+' '+(s.req>=7?'Master':s.req>=4?'Expert':'Novice')};
    if(pc.sp<s.sp) return {ok:false,why:'Not enough spell points'};
    if(pc.cond==='dead'||pc.cond==='unconscious') return {ok:false,why:pc.name+' cannot act'};
    return {ok:true};
  },
  // PURE: returns effect record. Caller deducts SP (amount echoed) and applies.
  resolve(pc,id,rand){
    const s=SPELLS[id]; const sk=pc.skills[s.school]||0;
    const eff={spell:id,name:s.name,school:s.school,spCost:s.sp,kind:s.kind,target:s.target,proj:s.proj||null,aoe:s.aoe||0};
    if(s.kind==='damage'||s.kind==='drain'){
      eff.damage=Math.max(1,rand.roll(s.n,s.d,(s.perSkill||0)*sk));
      if(s.vsUndead) eff.vsUndeadMult=s.vsUndead;
      if(s.kind==='drain') eff.selfHeal=Math.ceil(eff.damage/2);
    }
    if(s.kind==='heal') eff.heal=Math.max(1,rand.roll(s.n,s.d,(s.perSkill||0)*sk));
    if(s.kind==='buff'){ eff.buff=s.buff; eff.durMin=s.durMin+(s.perSkillDur||0)*sk; eff.acBonus=s.acBonus||0; eff.hitBonus=s.hitBonus||0; eff.dmgBonus=s.dmgBonus||0; }
    if(s.kind==='cureCond') eff.cures=s.cures;
    if(s.kind==='raise') eff.raise=true;
    if(s.kind==='restore') eff.restore=true;
    if(s.kind==='light') eff.lightDurMin=s.durMin;
    if(s.kind==='wizardEye') eff.wizardEyeDurMin=s.durMin;
    if(s.kind==='calm') eff.calmMin=s.durMin;
    return eff;
  },
  guildPrice(id){ const s=SPELLS[id]; return s.req>=7?2000:s.req>=4?400:60; },
  starting(cls){ // spells known at chargen
    return {paladin:['spirit_bless'],archer:['air_spark'],cleric:['body_heal','spirit_bless'],
      sorcerer:['fire_bolt','air_spark'],druid:['earth_stone','body_heal'],knight:[]}[cls]||[];
  }
};

  basePrice(inst){ const d=ITEMS[inst.id]; return d.price+(inst.ench?inst.ench.plus*120:0); },
  canEquip(pc,inst){
    const d=ITEMS[inst.id];
    if(!['weapon','shield','armor','helm','boots','ring','amulet'].includes(d.slot)) return false;
    if(d.skill && !(pc.skills[d.skill]>=1)) return false;
    return true;
  },
  equipStatBonus(pc,attr){
    let b=0;
    for(const k in pc.equip){ const it=pc.equip[k]; if(!it) continue; const d=ITEMS[it.id];
      if(d.stat===attr) b+=d.statPlus;
      if(it.ench&&it.ench.stat===attr) b+=it.ench.plus; }
    return b;
  },
};

function parseAscii(rows,opts){
  const h=rows.length,w=rows[0].length;
  for(const r of rows) if(r.length!==w) throw new Error('map row length mismatch: '+r);
  const cells=new Uint8Array(w*h), floor=new Uint8Array(w*h);
  const out={w,h,cells,floor,doors:{},shops:[],decor:[],spawns:[],portals:[],chests:[]};
  const wallTex=opts.wallTex, floorId=opts.floorId;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const ch=rows[y][x], i=y*w+x;
    floor[i]=floorId;
    switch(ch){
      case '#': cells[i]=wallTex; break;
      case 'H': cells[i]=2; break;
      case ',': floor[i]=0; break;
      case '.': floor[i]=opts.dotFloor!==undefined?opts.dotFloor:floorId; break;
      case '=': floor[i]=1; break;
      case ':': floor[i]=1; break; // gate opening in town wall
      case 'D': cells[i]=7; out.doors[x+','+y]={open:false}; break;
      case 'X': cells[i]=8; out.doors[x+','+y]={open:false,needs:'q_sigil'}; break;
      case 's': out.decor.push({kind:'sign',x:x+0.5,y:y+0.5}); floor[i]=opts.dotFloor??floorId; break;
      case 'F': out.decor.push({kind:'fountain',x:x+0.5,y:y+0.5,solid:true}); floor[i]=2; break;
      case 'U': out.portals.push({x,y,kind:'up'}); break;
      case 'S': out.portals.push({x,y,kind:'down'}); break;
      case 'E': out.portals.push({x,y,kind:'exitTeleport'}); break;
      case 'c': out.chests.push({x:x+0.5,y:y+0.5,tier:opts.chestTier||1,id:'c'+x+'_'+y}); break;
      case '1': out.chests.push({x:x+0.5,y:y+0.5,tier:2,id:'censer',special:'q_censer'}); break;
      case '2': out.chests.push({x:x+0.5,y:y+0.5,tier:4,id:'crown',special:'q_crown'}); break;
      default:
        if(opts.monsters&&opts.monsters[ch]) out.spawns.push({mid:opts.monsters[ch],x:x+0.5,y:y+0.5});
        break;
    }
    if(ch in SHOP_DOORS){ cells[i]=9; out.shops.push({x,y,shop:SHOP_DOORS[ch]}); }
  }
  return out;
}

// ---------- world builder ----------
const World = {
  maps:{},
  build(){
    this.maps={};
    this.buildOutdoor();
    this.buildDungeons();
    for(const id in this.maps) this.computeLightMap(this.maps[id]);
  },
  computeLightMap(map){ // per-cell glow from fire sources (0..6 shade relief)
    const lm=new Uint8Array(map.w*map.h);
    const SRC={campfire:[5,4.5],brazier:[4,3.8],lamp:[4,3.6]};
    for(const d of map.decor){
      const s=SRC[d.kind]; if(!s) continue;
      const [str,rad]=s;
      for(let y=Math.max(0,d.y-rad|0);y<=Math.min(map.h-1,d.y+rad|0);y++)
        for(let x=Math.max(0,d.x-rad|0);x<=Math.min(map.w-1,d.x+rad|0);x++){
          const dist=Math.hypot(x+0.5-d.x,y+0.5-d.y);
          if(dist>rad) continue;
          const v=lm[y*map.w+x]+Math.round(str*(1-dist/rad));
          lm[y*map.w+x]=v>6?6:v;
        }
    }
    map.lightMap=lm;
  },
  buildOutdoor(){
    const w=96,h=96, cells=new Uint8Array(w*h), floor=new Uint8Array(w*h);
    const map={id:'outdoor',name:'Vintavia Coast',w,h,cells,floor,outdoor:true,doors:{},shops:[],decor:[],monsters:[],portals:[],chests:[],npcs:[]};
    const r=RNG.world('outdoor');
    // rim mountains (2 thick) + terrain variety
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=y*w+x;
      if(x<2||y<2||x>=w-2||y>=h-2) cells[i]=3;
      else if((x<4||y<4||x>=w-4||y>=h-4)&&r.chance(0.5)) cells[i]=3;
      floor[i]= r.chance(0.06)?1:0; // dirt patches
    }
    // pond SE
    for(let y=62;y<72;y++)for(let x=64;x<78;x++){
      const dx=(x-71)/7,dy=(y-67)/5;
      if(dx*dx+dy*dy<1){ floor[y*w+x]=6; }
      else if(dx*dx+dy*dy<1.5&&floor[y*w+x]===0) floor[y*w+x]=7;
    }
    // stamp town template
    const t=parseAscii(TOWN_ROWS,{wallTex:1,floorId:2,dotFloor:2});
    for(let y=0;y<t.h;y++)for(let x=0;x<t.w;x++){
      const wi=(TOWN_Y+y)*w+(TOWN_X+x);
      cells[wi]=t.cells[y*t.w+x]; floor[wi]=t.floor[y*t.w+x];
    }
    for(const d of t.decor) map.decor.push({...d,x:d.x+TOWN_X,y:d.y+TOWN_Y});
    for(const s of t.shops) map.shops.push({x:s.x+TOWN_X,y:s.y+TOWN_Y,shop:s.shop});
    for(const k in t.doors){ const [x,y]=k.split(',').map(Number); map.doors[(x+TOWN_X)+','+(y+TOWN_Y)]=t.doors[k]; }
    // roads: east gate -> crypt; west gate -> goblin camp; south gate -> shrine
    const gateE={x:TOWN_X+37,y:TOWN_Y+7}, gateW={x:TOWN_X,y:TOWN_Y+7}, gateS={x:TOWN_X+21,y:TOWN_Y+15};
    this.road(map,gateE.x,gateE.y, 82,40); this.road(map,gateW.x,gateW.y, 13,36); this.road(map,gateS.x,gateS.y, 51,70);
    this.road(map,51,70, 40,64);
    // crypt entrance: rock outcrop with door portal
    for(let y=38;y<=42;y++)for(let x=83;x<=88;x++) cells[y*w+x]=3;
    cells[40*w+83]=0; floor[40*w+83]=1;
    map.portals.push({x:84,y:40,kind:'enter',to:'dun1'}); cells[40*w+84]=0; floor[40*w+84]=3;
    for(let y=39;y<=41;y++){cells[y*w+85]=3;} cells[40*w+85]=3;
    map.decor.push({kind:'cryptgate',x:84.5,y:39.6});
    map.decor.push({kind:'brazier',x:82.5,y:39.5},{kind:'brazier',x:82.5,y:41.5});
    map.decor.push({kind:'sign',x:82.5,y:42.5,label:'The Crypt'});
    // goblin camp W
    map.decor.push({kind:'campfire',x:12.5,y:36.5});
    map.decor.push({kind:'tent',x:10.5,y:34.5,solid:true},{kind:'tent',x:14.5,y:34.5,solid:true});
    // bandit camp NE
    this.road(map,gateE.x,gateE.y,70,17);
    map.decor.push({kind:'campfire',x:70.5,y:16.5});
    map.decor.push({kind:'tent',x:68.5,y:14.5,solid:true},{kind:'tent',x:72.5,y:14.5,solid:true},{kind:'tent',x:70.5,y:12.5,solid:true});
    map.chests.push({x:72.5,y:16.5,tier:2,id:'banditchest'});
    map.decor.push({kind:'sign',x:66.5,y:20.5,label:'Bandit country — turn back!'});
    // shrine S + ranger hut
    map.decor.push({kind:'shrine',x:51.5,y:70.5,solid:true});
    map.chests.push({x:52.5,y:71.5,tier:1,id:'shrinechest'});
    for(let y=63;y<=65;y++)for(let x=39;x<=42;x++) cells[y*w+x]=2;
    cells[64*w+39]=0; floor[64*w+39]=1; map.decor.push({kind:'sign',x:38.5,y:65.5,label:'Ranger hut'});
    // trees + rocks (deterministic scatter, keep clear of town/roads/water)
    for(let i=0;i<1000;i++){
      const x=r.int(4,w-5)+0.5,y=r.int(4,h-5)+0.5, ci=Math.floor(y)*w+Math.floor(x);
      if(cells[ci]||floor[ci]===1||floor[ci]===6||floor[ci]===2) continue;
      if(x>TOWN_X-2&&x<TOWN_X+40&&y>TOWN_Y-2&&y<TOWN_Y+18) continue;
      const denseN = y<28; // north forest is real forest
      if(!denseN&&r.chance(0.3)) continue;
      map.decor.push({kind:r.chance(0.85)?'tree':'rock',x,y,solid:true});
      if(denseN&&r.chance(0.5)){ const x2=x+r.next()*2-1, y2=y+r.next()*2-1;
        const ci2=Math.floor(y2)*w+Math.floor(x2);
        if(!cells[ci2]&&floor[ci2]!==1&&floor[ci2]!==6) map.decor.push({kind:'tree',x:x2,y:y2,solid:true});
      }
    }
    // signposts at gates
    map.decor.push({kind:'sign',x:gateE.x+1.5,y:gateE.y+1.5,label:'East: The Crypt. North-east: bandit camp.'});
    map.decor.push({kind:'sign',x:gateW.x-1.5,y:gateW.y+1.5,label:'West: goblin dens. Travelers beware.'});
    map.decor.push({kind:'sign',x:gateS.x+1.5,y:gateS.y+2.5,label:'South: old shrine, ranger hut.'});
    map.decor.push({kind:'lamp',x:TOWN_X+16.5,y:TOWN_Y+6.5},{kind:'lamp',x:TOWN_X+22.5,y:TOWN_Y+8.5});
    // town folk (talkable decor NPCs)
    map.npcs.push({id:'folk1',x:TOWN_X+18.5,y:TOWN_Y+9.6,kind:'peasant_f',name:'Marta the Baker'});
    map.npcs.push({id:'folk2',x:TOWN_X+8.5,y:TOWN_Y+13.5,kind:'peasant_m',name:'Old Tam'});
    map.npcs.push({id:'folk3',x:TOWN_X+27.5,y:TOWN_Y+13.5,kind:'guard',name:'Guard Willem'});
    map.npcs.push({id:'folk4',x:TOWN_X+1.6,y:TOWN_Y+6.3,kind:'guard',name:'Guard Petra'}); // west gate post, clear of the temple door
    // monsters (seeded): weak goblin singles near town, wolves mid, camps, ridge casters
    const M=map.monsters;
    const near=[[24,28],[22,44],[40,52],[68,36],[52,26],[68,44],[36,22],[60,54]];
    for(const [x,y] of near) M.push(Monsters.make('goblin',x+0.5,y+0.5));
    for(let i=0;i<7;i++){ const x=r.int(14,80),y=r.int(50,86); if(this.openAt(map,x,y)) M.push(Monsters.make('wolf',x+0.5,y+0.5)); }
    // goblin camp: 5 goblins + warrior + shaman (side quest: kill 5 camp goblins)
    const camp=[[11,36],[13,37],[12,38],[15,36],[10,37]];
    for(const [x,y] of camp){ const m=Monsters.make('goblin',x+0.5,y+0.5); m.group='gobcamp'; M.push(m); }
    const gw=Monsters.make('goblin_war',13.5,35.5); gw.group='gobcamp'; M.push(gw);
    const gs=Monsters.make('goblin_sham',11.5,35.0); gs.group='gobcamp'; M.push(gs);
    // bandit camp: 3 bandits, 2 archers, captain (drops ledger)
    M.push(Monsters.make('bandit',69.5,17.5),Monsters.make('bandit',71.5,18.0),Monsters.make('bandit',68.5,15.5));
    M.push(Monsters.make('bandit_bow',72.5,15.5),Monsters.make('bandit_bow',67.5,13.5));
    M.push(Monsters.make('bandit_boss',70.5,14.2));
    // north forest direwolves
    M.push(Monsters.make('direwolf',30.5,12.5),Monsters.make('direwolf',44.5,10.5),Monsters.make('direwolf',56.5,14.5),Monsters.make('direwolf',38.5,16.5));
    // eastern ridge casters (far from town)
    M.push(Monsters.make('apprentice',86.5,28.5),Monsters.make('apprentice',88.5,52.5),Monsters.make('apprentice',84.5,60.5));
    this.maps.outdoor=map;
  },
  road(map,x0,y0,x1,y1){
    let x=x0,y=y0; const w=map.w;
    const put=(x,y)=>{ for(const [dx,dy] of [[0,0],[1,0],[0,1]]){ const i=(y+dy)*w+(x+dx); if(!map.cells[i]&&map.floor[i]!==6) map.floor[i]=1; } };
    while(x!==x1){ put(x,y); x+=Math.sign(x1-x); }
    while(y!==y1){ put(x,y); y+=Math.sign(y1-y); }
    put(x1,y1);
  },
  openAt(map,x,y){ const i=y*map.w+x; return !map.cells[i]&&map.floor[i]!==6; },
  buildDungeons(){
    const mk=(id,name,rows,opts,links)=>{
      const p=parseAscii(rows,opts);
      const map={id,name,w:p.w,h:p.h,cells:p.cells,floor:p.floor,outdoor:false,doors:p.doors,shops:[],
        decor:p.decor,monsters:p.spawns.map(s=>Monsters.make(s.mid,s.x,s.y)),portals:[],chests:p.chests,npcs:[],dungeonLight:0.28};
      for(const pt of p.portals){
        if(pt.kind==='up') map.portals.push({x:pt.x,y:pt.y,kind:'enter',to:links.up.map,tx:links.up.x,ty:links.up.y,label:'ascend'});
        if(pt.kind==='down') map.portals.push({x:pt.x,y:pt.y,kind:'enter',to:links.down.map,tx:links.down.x,ty:links.down.y,label:'descend'});
        if(pt.kind==='exitTeleport') map.portals.push({x:pt.x,y:pt.y,kind:'enter',to:'outdoor',tx:82.5,ty:40.5,label:'teleport'});
      }
      // braziers to light the way
      for(const c of p.chests) map.decor.push({kind:'brazier',x:c.x>2?c.x-1:c.x+1,y:c.y});
      this.maps[id]=map;
    };
    mk('dun1','The Crypt',DUN1_ROWS,{wallTex:5,floorId:4,chestTier:1,monsters:{a:'bat',p:'spider',k:'skeleton',z:'zombie'}},
      {up:{map:'outdoor',x:82.5,y:40.5},down:{map:'dun2',x:2.5,y:1.8}});
    mk('dun2','The Catacombs',DUN2_ROWS,{wallTex:4,floorId:3,chestTier:2,monsters:{k:'skeleton',G:'skel_guard',z:'zombie',g:'ghost',n:'necromancer'}},
      {up:{map:'dun1',x:27.2,y:13.5},down:{map:'dun3',x:2.5,y:1.8}});
    mk('dun3','The Vault of Vintavia',DUN3_ROWS,{wallTex:6,floorId:5,chestTier:3,monsters:{G:'skel_guard',L:'lich'}},
      {up:{map:'dun2',x:27.5,y:13.5},down:{map:'dun2',x:27.5,y:13.5}});
  },
  spawnPoint(){ return {map:'outdoor',x:TOWN_X+4.5,y:TOWN_Y+7.5,ang:-Math.PI/2}; }, // main street, facing weapon smith
  templePoint(){ return {map:'outdoor',x:TOWN_X+4.5,y:TOWN_Y+9.2,ang:Math.PI/2}; },
};

// ===== 05_engine.js =====
// 05_engine — software raycaster + palettised framebuffer. Owner: engine.
// Renders into a 640x480 Uint32 buffer; everything (3D, UI, text) goes through it.
'use strict';

const SCREEN_W=640, SCREEN_H=480;
const VP={x:8,y:8,w:464,h:312}; // 3D viewport inside the stone frame
const FOV=Math.PI/2.9;

const Engine = {
  canvas:null,ctx:null,img:null,buf:null,       // buf: Uint32Array over ImageData
  zbuf:new Float32Array(VP.w),
  renderScale:1, frameAvg:8, lastAuto:0,
  cssScale:1, offX:0, offY:0,                    // canvas placement for input mapping

  init(canvas){
    this.canvas=canvas; this.ctx=canvas.getContext('2d',{alpha:false});
    canvas.width=SCREEN_W; canvas.height=SCREEN_H;
    this.img=this.ctx.createImageData(SCREEN_W,SCREEN_H);
    this.buf=new Uint32Array(this.img.data.buffer);
    this.resize(); addEventListener('resize',()=>this.resize());
    if(screen&&screen.orientation) try{screen.orientation.addEventListener('change',()=>setTimeout(()=>this.resize(),80));}catch(e){}
  },
  resize(){
    const vw=innerWidth, vh=innerHeight;
    const s=Math.min(vw/SCREEN_W, vh/SCREEN_H);
    // prefer crisp integer scale when close
    const is=Math.floor(s); const scale=(is>=1 && s/is<1.35)?is:s;
    const w=SCREEN_W*scale, h=SCREEN_H*scale;
    Object.assign(this.canvas.style,{width:w+'px',height:h+'px'});
    this.cssScale=scale; this.offX=(vw-w)/2; this.offY=(vh-h)/2;
  },
  present(){ this.ctx.putImageData(this.img,0,0); },
  toGame(clientX,clientY){ // css px -> 640x480 coords
    return {x:(clientX-this.offX)/this.cssScale, y:(clientY-this.offY)/this.cssScale};
  },

  // ---------- framebuffer primitives (palette indices) ----------
  clear(idx){ this.buf.fill(PAL32[idx]); },
  px(x,y,idx){ if(x>=0&&y>=0&&x<SCREEN_W&&y<SCREEN_H) this.buf[y*SCREEN_W+x]=PAL32[idx]; },
  fillRect(x,y,w,h,idx){
    x|=0;y|=0;w|=0;h|=0;
    const c=PAL32[idx];
    for(let j=Math.max(0,y);j<Math.min(SCREEN_H,y+h);j++){
      const row=j*SCREEN_W;
      for(let i=Math.max(0,x);i<Math.min(SCREEN_W,x+w);i++) this.buf[row+i]=c;
    }
  },
  frameRect(x,y,w,h,idx){ this.fillRect(x,y,w,1,idx); this.fillRect(x,y+h-1,w,1,idx); this.fillRect(x,y,1,h,idx); this.fillRect(x+w-1,y,1,h,idx); },
  // blit palette-indexed texture (0 = transparent)
  blit(tex,tw,th,dx,dy,opts){
    dx|=0; dy|=0;
    const flip=opts&&opts.flip, shade=opts&&opts.shade||0, scale=opts&&opts.scale||1;
    if(scale===1){
      for(let y=0;y<th;y++){ const sy=dy+y; if(sy<0||sy>=SCREEN_H) continue; const row=sy*SCREEN_W;
        for(let x=0;x<tw;x++){ const sx=dx+x; if(sx<0||sx>=SCREEN_W) continue;
          let p=tex[y*tw+(flip?tw-1-x:x)]; if(!p) continue;
          if(shade){ const s=(p&15)-shade; p=(p&240)|(s<0?0:s); }
          this.buf[row+sx]=PAL32[p];
        }
      }
    } else {
      const w2=(tw*scale)|0,h2=(th*scale)|0;
      for(let y=0;y<h2;y++){ const sy=dy+y; if(sy<0||sy>=SCREEN_H) continue; const row=sy*SCREEN_W; const ty=(y/scale)|0;
        for(let x=0;x<w2;x++){ const sx=dx+x; if(sx<0||sx>=SCREEN_W) continue;
          let p=tex[ty*tw+((flip?(w2-1-x):x)/scale|0)]; if(!p) continue;
          if(shade){ const s=(p&15)-shade; p=(p&240)|(s<0?0:s); }
          this.buf[row+sx]=PAL32[p];
        }
      }
    }
  },

  // ---------- text ----------
  text(str,x,y,opts){ return Art.font.draw(this,str,x,y,opts||{}); },
  textW(str,size){ return Art.font.width(str,size||10); },
  textC(str,cx,y,opts){ const w=this.textW(str,(opts&&opts.size)||10); this.text(str,cx-w/2|0,y,opts); },

  // ---------- 3D view ----------
  render3D(cam){
    const t0=performance.now();
    const sc=this.renderScale;
    const w=(VP.w*sc)|0, h=(VP.h*sc)|0;
    if(!this._fb||this._fb.length!==w*h){ this._fb=new Uint8Array(w*h); this._zb=new Float32Array(w); }
    const fb=this._fb, zb=this._zb;
    const map=cam.map, cells=map.cells, floorIds=map.floor, mw=map.w, mh=map.h;
    const dirX=Math.cos(cam.ang), dirY=Math.sin(cam.ang);
    const planeLen=Math.tan(FOV/2);
    const planeX=-dirY*planeLen, planeY=dirX*planeLen;
    const posX=cam.x, posY=cam.y;
    const horizon=(h/2 + (cam.bob||0)*sc)|0;
    const light=cam.light;               // 0..1 global
    const torch=cam.torch||0;            // extra radius light indoors
    const outdoor=map.outdoor;
    // fire-glow map, pre-scaled per frame bucket (noon drowns it outdoors)
    const lmScale=outdoor? (1-light)*1.1 : 1;
    let lm2=null;
    if(map.lightMap&&lmScale>0.05){
      const bucket=(lmScale*8)|0;
      if(this._lmMap!==map||this._lmBucket!==bucket){
        this._lmMap=map; this._lmBucket=bucket;
        const src=map.lightMap, out=this._lm2=new Uint8Array(src.length);
        for(let i=0;i<src.length;i++) out[i]=(src[i]*lmScale)|0;
      }
      lm2=this._lm2;
    }
    const glowAt=(cx,cy)=>lm2? (cx>=0&&cy>=0&&cx<mw&&cy<mh? lm2[cy*mw+cx]:0):0;
    const shadeAt=(d,side)=>{           // returns 0..12 darkening
      let s=(outdoor? Math.min(d*0.22,5.0) : d*(1.7-torch*0.9)); // day never fades to black — haze handles distance
      s+= (1-light)*(outdoor?7:3);
      if(side) s+=1.2;
      return s>12?12:s|0;
    };
    // distance haze: far geometry dissolves into the sky (1998 outdoor depth cue)
    const hh=((cam.timeMin%1440)/60);
    const warmHour=(hh>=4.8&&hh<7.5)||(hh>=18.5&&hh<21);
    const hazeOn=outdoor&&light>0.25;
    const hazeIdx=warmHour? palIdx(12,(5+light*5)|0) : palIdx(3,(9+light*4)|0);
    const hazeLvl=d=>d>28?3:d>19?2:d>12?1:0; // 0 none, 1=25%, 2=50%, 3=75% dither to sky
    const HZT=[0,4,8,12]; // Bayer thresholds per haze level (ordered dither, no hatch artifacts)
    const cellJit=(cx,cy)=>((cx*97+cy*57)&63); // per-cell texture offset kills tiling
    // sky / ceiling
    if(outdoor){
      const sky=Art.sky(cam.timeMin), skw=sky.w;
      const angOff=((cam.ang%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      for(let y=0;y<horizon;y++){
        const sy=(y/horizon*sky.h)|0;
        for(let x=0;x<w;x++){
          const sx=((angOff/(Math.PI*2)*skw*2)+(x/w*skw*planeLen))%skw|0;
          fb[y*w+x]=sky.tex[sy*skw+sx];
        }
      }
    }
    // floor & ceiling casting
    {
      const flTexs=Art.floors, ceilTex=Art.ceilings[map.id]||Art.ceilings.default;
      const rowStart=outdoor?horizon:0;
      for(let y=rowStart;y<h;y++){
        const isFloor=y>=horizon;
        const p=isFloor? (y-horizon):(horizon-y);
        if(p===0) continue;
        const rowDist=(h*0.5)/p;
        const stepX=rowDist*(2*planeX)/w, stepY=rowDist*(2*planeY)/w;
        let fx=posX+rowDist*(dirX-planeX), fy=posY+rowDist*(dirY-planeY);
        const sh=shadeAt(rowDist,0);
        const hz=hazeOn&&isFloor?hazeLvl(rowDist):0;
        const row=y*w;
        for(let x=0;x<w;x++){
          const cx=fx|0, cy=fy|0;
          if(hz&&BAYER4[((y&3)<<2)|(x&3)]<HZT[hz]){ fb[row+x]=hazeIdx; fx+=stepX; fy+=stepY; continue; }
          let tex;
          if(cx>=0&&cy>=0&&cx<mw&&cy<mh){
            tex=isFloor? flTexs[floorIds[cy*mw+cx]] : ceilTex; // water frames swapped in Art.tick
          } else tex=isFloor?flTexs[0]:ceilTex;
          const jit=cellJit(cx,cy);
          const tx=((((fx-cx)*64)|0)+jit)&63, ty=((((fy-cy)*64)|0)+(jit>>1))&63;
          let pi=tex[ty*64+tx];
          let s=(pi&15)-sh;
          if(lm2&&cx>=0&&cy>=0&&cx<mw&&cy<mh) s+=lm2[cy*mw+cx];
          fb[row+x]=(pi&240)|(s<0?0:s>15?15:s);
          fx+=stepX; fy+=stepY;
        }
      }
      if(!outdoor){} // dungeon ceiling handled above (rowStart 0)
    }
    // walls (DDA per column)
    for(let x=0;x<w;x++){
      const camU=2*x/w-1;
      const rdX=dirX+planeX*camU, rdY=dirY+planeY*camU;
      let mapX=posX|0, mapY=posY|0;
      const ddX=Math.abs(1/(rdX||1e-9)), ddY=Math.abs(1/(rdY||1e-9));
      let stX,stY,sdX,sdY;
      if(rdX<0){stX=-1; sdX=(posX-mapX)*ddX;} else {stX=1; sdX=(mapX+1-posX)*ddX;}
      if(rdY<0){stY=-1; sdY=(posY-mapY)*ddY;} else {stY=1; sdY=(mapY+1-posY)*ddY;}
      let side=0, hit=0, tex=0, doorT=0, dist=0, wallX=0;
      for(let i=0;i<64;i++){
        if(sdX<sdY){ sdX+=ddX; mapX+=stX; side=0; } else { sdY+=ddY; mapY+=stY; side=1; }
        if(mapX<0||mapY<0||mapX>=mw||mapY>=mh){ hit=1; tex=outdoor?3:4; dist=side?sdY-ddY:sdX-ddX; break; }
        const c=cells[mapY*mw+mapX];
        if(c){
          if(c===7||c===8){ // door: mid-cell plane
            const d=(side? sdY-ddY+ddY/2 : sdX-ddX+ddX/2);
            const hx=posX+rdX*d, hy=posY+rdY*d;
            if((side&&(hx|0)===mapX)||(!side&&(hy|0)===mapY)){
              const door=map.doors[mapX+','+mapY];
              const t=door?door.t||0:0;
              let wx=side? hx-(hx|0) : hy-(hy|0);
              if(wx>t){ // door body (slides into wall as t->1)
                hit=1; tex=c; dist=d; wallX=wx-t; doorT=t; break;
              } else continue;
            } else continue;
          }
          hit=1; tex=c; dist=side? sdY-ddY : sdX-ddX; break;
        }
      }
      if(!hit){ zb[x]=1e9; continue; }
      // DDA side-dist form already yields perpendicular distance (door dist too)
      dist=Math.max(0.02,dist);
      zb[x]=dist;
      const lineH=(h/dist)|0;
      let y0=horizon-(lineH>>1), y1=y0+lineH;
      if(wallX===0){ const hx=posX+rdX*dist, hy=posY+rdY*dist; wallX=side? hx-(hx|0): hy-(hy|0); }
      let texX=(wallX*64)|0; if((side===0&&rdX>0)||(side===1&&rdY<0)) texX=63-texX;
      if(tex!==7&&tex!==8&&tex!==9) texX=(texX+cellJit(mapX,mapY))&63; // vary repeats (not doors/shopfronts)
      const wt=Art.walls[tex];
      const sh=shadeAt(dist,side)-(glowAt(mapX,mapY)|0);
      const hz=hazeOn?hazeLvl(dist):0;
      const step=64/lineH;
      let tpos=y0<0? -y0*step:0;
      const ys=Math.max(0,y0), ye=Math.min(h,y1);
      for(let y=ys;y<ye;y++){
        if(hz&&BAYER4[((y&3)<<2)|(x&3)]<HZT[hz]){ fb[y*w+x]=hazeIdx; tpos+=step; continue; }
        const pi=wt[((tpos|0)&63)*64+texX]; tpos+=step;
        const s=(pi&15)-sh;
        fb[y*w+x]=(pi&240)|(s<0?0:s>15?15:s);
      }
    }
    // sprites (far to near)
    const ents=cam.entities;
    ents.sort((a,b)=>(dist2(b.x,b.y,posX,posY))-(dist2(a.x,a.y,posX,posY)));
    const invDet=1/(planeX*dirY-dirX*planeY);
    for(const e of ents){
      const relX=e.x-posX, relY=e.y-posY;
      const trX=invDet*(dirY*relX-dirX*relY);   // screen x
      const trY=invDet*(-planeY*relX+planeX*relY); // depth
      if(trY<=0.1) continue;
      const scr=((w/2)*(1+trX/trY))|0;
      const sprH=Math.abs((h/trY)*(e.scale||1))|0;
      const sprW=(sprH*e.tw/e.th)|0;
      const vOff=((e.vOff||0)*h/trY)|0;
      let y0=horizon-sprH+((h/trY)>>1)+vOff, y1=y0+sprH;
      let x0=scr-(sprW>>1), x1=x0+sprW;
      if(x1<0||x0>=w) continue;
      const tex=e.tex, tw=e.tw, th=e.th;
      const sh=shadeAt(trY,0)+(e.shade||0)-(glowAt(e.x|0,e.y|0)|0);
      const ghost=e.ghost;
      const hz=hazeOn?hazeLvl(trY):0; // far sprites dissolve into the haze too
      for(let sx=Math.max(0,x0);sx<Math.min(w,x1);sx++){
        if(zb[sx]<=trY) continue;
        const texX=((sx-x0)*tw/sprW)|0;
        for(let sy=Math.max(0,y0);sy<Math.min(h,y1);sy++){
          if(ghost&&((sx+sy)&1)) continue; // dithered translucency
          if(hz&&BAYER4[((sy&3)<<2)|(sx&3)]<HZT[hz]) continue;
          const pi=tex[(((sy-y0)*th/sprH)|0)*tw+texX];
          if(!pi) continue;
          const s=(pi&15)-sh;
          fb[sy*w+sx]=(pi&240)|(s<0?0:s);
        }
      }
      if(e.onScreen) e.onScreen(scr/w, trY);
    }
    // blit fb -> screen buffer at viewport (integer upscale if renderScale<1)
    const buf=this.buf;
    if(sc===1){
      for(let y=0;y<h;y++){ const src=y*w, dst=(VP.y+y)*SCREEN_W+VP.x;
        for(let x=0;x<w;x++) buf[dst+x]=PAL32[fb[src+x]];
      }
    } else {
      const up=1/sc|0;
      for(let y=0;y<VP.h;y++){ const src=((y*sc)|0)*w, dst=(VP.y+y)*SCREEN_W+VP.x;
        for(let x=0;x<VP.w;x++) buf[dst+x]=PAL32[fb[src+((x*sc)|0)]];
      }
    }
    // adaptive render scale
    const dt=performance.now()-t0;
    this.frameAvg=this.frameAvg*0.92+dt*0.08;
    if(performance.now()-this.lastAuto>1500){
      if(this.frameAvg>14&&this.renderScale===1){ this.renderScale=0.5; this.lastAuto=performance.now(); }
      else if(this.frameAvg<5&&this.renderScale<1){ this.renderScale=1; this.lastAuto=performance.now(); }
    }
    // copy zbuffer out for HUD targeting
    for(let x=0;x<VP.w;x++) this.zbuf[x]=zb[(x*sc)|0]||1e9;
  },
};

// ===== 06_art.js =====
// 06_art — procedural textures, sky, bitmap font, carved-stone UI frame. Owner: art.
// Everything bakes to palette-indexed Uint8Arrays (0 = transparent, 240 = black).
'use strict';

const Art = {
  walls:{}, floors:{}, ceilings:{}, sprites:{}, icons:{}, portraits:{}, portraitsPain:{}, paperdolls:{}, ui:{}, font:null,
  _skyCache:{}, _water:[null,null], _waterFlip:0,
};

function bakeFromCanvas(w,h,painter,ditherAmt){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d',{willReadFrequently:true});
  painter(g,w,h);
  const d=g.getImageData(0,0,w,h).data;
  const out=new Uint8Array(w*h);
  const amt=ditherAmt===undefined?12:ditherAmt;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    if(d[i+3]<110){ out[y*w+x]=0; continue; }
    let p=palDither(d[i],d[i+1],d[i+2],x,y,amt);
    out[y*w+x]=p===0?240:p;
  }
  return out;
}
// direct palette painter (per-pixel, for tileable noise textures).
// NOTE: returns are used verbatim — 0 stays 0 (transparent in blit paths);
// painters wanting true black must return 240 explicitly.
function bakePix(w,h,fn){
  const out=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){ out[y*w+x]=fn(x,y); }
  return out;
}
// value noise (tileable over period)
function makeNoise(seedKey,period){
  const r=RNG.world('art:'+seedKey), grid=[];
  for(let i=0;i<period*period;i++) grid.push(r.next());
  return (x,y)=>{
    const xi=Math.floor(x)%period,yi=Math.floor(y)%period;
    const xf=x-Math.floor(x),yf=y-Math.floor(y);
    const g=(a,b)=>grid[((b+period)%period)*period+((a+period)%period)];
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return lerp(lerp(g(xi,yi),g(xi+1,yi),u),lerp(g(xi,yi+1),g(xi+1,yi+1),u),v);
  };
}

// ---------- wall / floor textures (64x64, palette space) ----------
Art.bakeTextures=function(){
  const N=makeNoise('n1',16), N2=makeNoise('n2',8), N3=makeNoise('n3',32);
  const brickPat=(x,y,bw,bh,mortar)=>{ // returns 0 edge .. 1 center of brick
    const row=Math.floor(y/bh), off=(row%2)*(bw/2);
    const bx=(x+off)%bw, by=y%bh;
    const ex=Math.min(bx,bw-bx)/mortar, ey=Math.min(by,bh-by)/mortar;
    return Math.min(1,Math.min(ex,ey));
  };
  // 1: town stone — big ashlar blocks, weathered: grime streaks + moss at the base
  Art.walls[1]=bakePix(64,64,(x,y)=>{
    const b=brickPat(x,y,32,16,2.4), n=N(x/6,y/6);
    const streak=N2(x/1.8,7.3)>0.78&&y>10? 2:0; // vertical water stains
    const chip=N2(x/2.2,y/2.2)>0.9?2:0;
    if(y>46&&N2(x/3.5,y/3)>0.7&&b>0.4) return palIdx(13,3+(n*3|0)); // moss creep
    const s=3+b*5+n*3.4-streak-chip;
    return palIdx(0,clamp(s|0,1,11));
  });
  // 2: timber house — cream plaster + dark beams + window glow
  Art.walls[2]=bakePix(64,64,(x,y)=>{
    const beam=(x<5||x>=59||(y>28&&y<34)||(x>29&&x<35&&y<30));
    const nm=N(x/5,y/5);
    if(beam) return palIdx(1,3+(N2(x/2,y/2)*2|0));
    if(x>=12&&x<26&&y>=38&&y<54){ // shuttered window
      if(x<14||x>=24||y<40||y>=52) return palIdx(1,4);
      return palIdx(5,6+((x+y)%3));
    }
    return palIdx(1,10+(nm*4|0));
  });
  // 3: mountain rock
  Art.walls[3]=bakePix(64,64,(x,y)=>{
    const n=N3(x/9,y/7)*0.6+N(x/3,y/3)*0.4;
    const crack=N2(x/2.2,y/2.2)>0.82;
    return palIdx(11,crack?2:3+(n*8|0));
  });
  // 4: dungeon brick (catacombs) — rough, high-frequency grain
  Art.walls[4]=bakePix(64,64,(x,y)=>{
    const b=brickPat(x,y,16,8,1.6), n=N(x/4,y/4), g=N2(x/1.3,y/1.3)*1.6-0.8;
    return palIdx(11,clamp(1+b*(4+n*5)+g,0,10)|0);
  });
  // 5: crypt stone — pale ashlar, subtle bone inlay, chiseled grain
  Art.walls[5]=bakePix(64,64,(x,y)=>{
    const b=brickPat(x,y,32,13,2), n=N(x/5,y/5), g=N2(x/1.4,y/1.4)*1.6-0.8;
    const bone=(y%13>4&&y%13<8)&&N2(x/3,17)>0.8;
    if(bone&&b>0.6) return palIdx(0,9+(x%2));
    return palIdx(0,clamp(2+b*(3+n*5)+g,0,11)|0);
  });
  // 6: vault marble — dark green-black with gold veins
  Art.walls[6]=bakePix(64,64,(x,y)=>{
    const v=Math.abs(N3(x/16,y/5)-0.5)<0.03||Math.abs(N(x/7,y/13)-0.55)<0.02;
    const b=brickPat(x,y,64,21,2);
    if(v&&b>0.3) return palIdx(5,8+((x+y)%3));
    return palIdx(13,1+(b*2.5+N2(x/4,y/4)*2|0));
  });
  // 7: wood door — planks + iron bands + ring
  Art.walls[7]=bakePix(64,64,(x,y)=>{
    const plank=(x%13)<1.2, grain=N(x/2.5,y/9);
    if(y<4||y>=60||(y>28&&y<33)) { // iron bands
      const riv=((x+3)%10<2)&&(y%64<4||y>=60||(y>29&&y<32));
      return palIdx(11,riv?7:4+(N2(x/2,y/2)*2|0));
    }
    const cx=x-32,cy=y-44; if(cx*cx+cy*cy<25&&cx*cx+cy*cy>9) return palIdx(11,6); // ring
    if(plank) return palIdx(1,2);
    return palIdx(1,4+(grain*4|0));
  });
  // 8: sigil door — dark door + glowing teal sigil
  Art.walls[8]=bakePix(64,64,(x,y)=>{
    const cx=(x-32)/20,cy=(y-32)/20, r=Math.hypot(cx,cy);
    const ring=Math.abs(r-0.8)<0.09, cross=(Math.abs(cx)<0.07||Math.abs(cy)<0.07)&&r<0.8;
    if(ring||cross) return palIdx(8,10+((x+y)%4));
    const plank=(x%16)<1.4;
    return palIdx(11,plank?1:2+(N(x/3,y/7)*2.5|0));
  });
  // 9: shopfront — timber + sign board area
  Art.walls[9]=bakePix(64,64,(x,y)=>{
    if(y>=6&&y<20&&x>=8&&x<56){ // painted sign board
      if(y<8||y>=18||x<10||x>=54) return palIdx(5,5);
      return palIdx(14,4+(N(x/4,y/3)*2|0));
    }
    const beam=(x<4||x>=60||y<3||(y>=52));
    if(beam) return palIdx(1,3);
    if(y>=22&&y<50&&x>=14&&x<50){ // door arch
      const plank=(x%9)<1;
      return palIdx(1,plank?2:5+(N(x/3,y/8)*3|0));
    }
    return palIdx(1,9+(N(x/5,y/5)*3|0));
  });
  // floors
  Art.floors[0]=bakePix(64,64,(x,y)=>{ // grass: blade speckle over tonal patches
    const n=N(x/5,y/5), b=N2(x/1.7,y/1.7), fine=N2(x/1.1,y/1.1);
    let s=6+n*4+(b>0.8?3:0)+(fine>0.72?1.5:fine<0.25?-1.5:0);
    return palIdx(b>0.9?9:2,clamp(s,3,13)|0);
  });
  Art.floors[1]=bakePix(64,64,(x,y)=>{ // dirt road: ruts, pebbles, grain
    const n=N(x/6,y/6), stone=N2(x/2.5,y/2.5)>0.86, fine=N2(x/1.2,y/1.2);
    if(stone) return palIdx(0,8);
    const rut=Math.abs(((y+x*0.15)%21)-10)<1.4?-1.2:0;
    return palIdx(1,clamp(5+n*4+rut+(fine-0.5)*2.2,2,11)|0);
  });
  Art.floors[2]=bakePix(64,64,(x,y)=>{ // cobble
    const cx=x%16-8, cy=y%16-8, d=Math.hypot(cx,cy)/8;
    const alt=((x/16|0)+(y/16|0))%2;
    const n=N(x/4,y/4);
    return palIdx(0,clamp(9-d*4+n*3+(alt?0:1),2,12)|0);
  });
  Art.floors[3]=bakePix(64,64,(x,y)=>{ // dungeon slabs
    const b=brickPat(x,y,32,32,2), n=N(x/5,y/5);
    return palIdx(11,1+b*(3+n*4)|0);
  });
  Art.floors[4]=bakePix(64,64,(x,y)=>{ // crypt tiles, cracked
    const b=brickPat(x,y,21,21,1.6), crack=N2(x/2,y/2)>0.87;
    return palIdx(0,crack?1:2+b*(3+N(x/6,y/6)*4)|0);
  });
  Art.floors[5]=bakePix(64,64,(x,y)=>{ // vault marble floor: pale slabs, gold trim
    if(x%32<2||y%32<2) return palIdx(5,7+((x+y)%2)); // gold seams
    const v=Math.abs(N(x/9,y/16)-0.5)<0.025;
    const b=brickPat(x,y,32,32,1.5);
    if(v&&b>0.3) return palIdx(8,8);
    return palIdx(0,4+(b*4+N2(x/6,y/6)*2|0));
  });
  // water (2 frames, swapped by Art.tick)
  const wat=(ph)=>bakePix(64,64,(x,y)=>{
    const w1=Math.sin((x+ph*7)/6+Math.sin((y+ph*5)/9)*2)*0.5+0.5;
    const w2=Math.sin((y-ph*6)/5+x/11)*0.5+0.5;
    const v=(w1*0.6+w2*0.4);
    return palIdx(3,4+(v*6|0));
  });
  Art._water[0]=wat(0); Art._water[1]=wat(1.5);
  Art.floors[6]=Art._water[0];
  Art.floors[7]=bakePix(64,64,(x,y)=>palIdx(5,9+(N(x/4,y/4)*3|0))); // sand
  // ceilings — one identity per dungeon level
  Art.ceilings.default=bakePix(64,64,(x,y)=>palIdx(11,2+(N(x/6,y/6)*3|0)));
  Art.ceilings.dun1=bakePix(64,64,(x,y)=>{ // crypt: pale vaulted ribs
    const rib=(x%32<3)||(y%32<3);
    return palIdx(0,(rib?4:2)+(N(x/6,y/6)*2|0));
  });
  Art.ceilings.dun2=bakePix(64,64,(x,y)=>{ // catacombs: rough dark brick
    const b=brickPat(x,y,16,8,1.4);
    return palIdx(11,(b*3+N(x/4,y/4)*2|0));
  });
  Art.ceilings.dun3=bakePix(64,64,(x,y)=>{
    const v=Math.abs(N(x/9,y/16)-0.5)<0.02;
    return v?palIdx(5,7):palIdx(13,1+(N2(x/5,y/5)*2|0));
  });
};
Art.tick=function(ms){
  const f=(ms/420|0)%2;
  if(f!==Art._waterFlip){ Art._waterFlip=f; Art.floors[6]=Art._water[f]; }
};

// ---------- sky (baked per time bucket) ----------
Art.sky=function(timeMin){
  const h=(timeMin%1440)/60;
  const bucket=h<5?'night':h<7?'dawn':h<11?'morning':h<16?'noon':h<19?'late':h<21?'dusk':'night';
  if(Art._skyCache[bucket]) return Art._skyCache[bucket];
  const w=1024,hh=200;
  const grads={ night:[[8,10,26],[16,18,40]], dawn:[[60,40,80],[240,150,90]], morning:[[70,120,200],[170,200,235]],
    noon:[[80,140,220],[190,215,240]], late:[[70,120,200],[210,190,150]], dusk:[[40,30,70],[240,120,60]] };
  const [top,bot]=grads[bucket];
  const r=RNG.world('sky:'+bucket);
  const stars=[]; if(bucket==='night') for(let i=0;i<130;i++) stars.push([r.int(0,w-1),r.int(0,hh*0.85|0),r.chance(0.2)?2:1]);
  const clouds=[]; const nC=bucket==='night'?4:9;
  for(let i=0;i<nC;i++) clouds.push([r.int(0,w-1),r.int(10,hh*0.55|0),r.int(30,90),r.int(8,18),r.next()*0.5+0.3]);
  const sunX=w*0.62, sunY=bucket==='dawn'?hh*0.75:bucket==='dusk'?hh*0.8:hh*0.3;
  const tex=bakePix(w,hh,(x,y)=>{
    const t=y/hh;
    let R=lerp(top[0],bot[0],t),G=lerp(top[1],bot[1],t),B=lerp(top[2],bot[2],t);
    // sun / moon
    const isNight=bucket==='night';
    const sx=isNight?w*0.3:sunX, sy=isNight?hh*0.25:sunY;
    let dx=Math.min(Math.abs(x-sx),w-Math.abs(x-sx)), dy=y-sy;
    const d=Math.hypot(dx,dy);
    if(isNight){ if(d<9&&!(Math.hypot(dx-4,dy-2)<7)) {R=230;G=230;B=215;} }
    else if(d<11){R=255;G=245;B=200;} else if(d<26){R=lerp(R,255,(26-d)/17*0.5);G=lerp(G,240,(26-d)/17*0.4);}
    const warm=bucket==='dawn'||bucket==='dusk';
    for(const [cx,cy,cw,ch,op] of clouds){
      let ddx=Math.min(Math.abs(x-cx),w-Math.abs(x-cx))/cw, ddy=(y-cy)/ch;
      const cd=ddx*ddx+ddy*ddy;
      if(cd<1){ const k=(1-cd)*op;
        const cr=isNight?55:warm?250:245, cg=isNight?58:warm?185:243, cb=isNight?72:warm?135:250;
        R=lerp(R,cr,k);G=lerp(G,cg,k);B=lerp(B,cb,k*0.9); }
    }
    for(const [px,py,s] of stars){ if(Math.abs(x-px)<s&&Math.abs(y-py)<s){R=240;G=240;B=220;} }
    return palDither(R,G,B,x,y,10);
  });
  const o={tex,w,h:hh}; Art._skyCache[bucket]=o; return o;
};

// ---------- font (Georgia glyphs quantized to levels) ----------
Art.bakeFont=function(){
  const sizes=[9,11,14,22];
  const font={sizes:{},draw:null,width:null};
  const cnv=document.createElement('canvas'); cnv.width=48; cnv.height=48;
  const g=cnv.getContext('2d',{willReadFrequently:true});
  const EXTRA='’‘“”—–◆✓►◄−×…é↑↓←→·';
  for(const sz of sizes){
    const glyphs={};
    g.font='bold '+sz+'px Georgia, "Times New Roman", serif';
    const chars=[]; for(let c=32;c<127;c++) chars.push(String.fromCharCode(c)); for(const ch of EXTRA) chars.push(ch);
    for(const ch of chars){
      const met=g.measureText(ch);
      const gw=Math.max(1,Math.ceil(met.width)), gh=sz+4;
      g.clearRect(0,0,48,48);
      g.font='bold '+sz+'px Georgia, "Times New Roman", serif';
      g.fillStyle='#fff'; g.textBaseline='top';
      g.fillText(ch,1,1);
      const d=g.getImageData(0,0,Math.min(48,gw+2),gh).data;
      const w2=Math.min(48,gw+2);
      const data=new Uint8Array(w2*gh);
      for(let i=0;i<w2*gh;i++){ const a=d[i*4+3]; data[i]=a>190?3:a>110?2:a>36?1:0; } // low floor keeps colon dots alive
      glyphs[ch]={w:w2,h:gh,adv:gw+1,data};
    }
    font.sizes[sz]=glyphs;
  }
  font.width=(str,size)=>{ const gs=font.sizes[size]||font.sizes[11]; let w=0; for(const ch of str){ if(ch===':'){w+=5;continue;} const gl=gs[ch]||gs['?']; w+=gl.adv; } return w; };
  const FALLBACK={'’':"'",'‘':"'",'“':'"','”':'"','—':'-','–':'-','−':'-','…':'...'};
  font.draw=(eng,str,x,y,opts)=>{
    const size=opts.size||11, ramp=opts.ramp===undefined?5:opts.ramp, gs=font.sizes[size]||font.sizes[11];
    const shades=opts.bright? [0,9,12,15]:[0,7,10,13];
    let cx=x|0;
    for(const ch of str){
      if(ch===':'){ // hand-placed: quantization eats the top dot at small sizes
        const dotY1=(y|0)+Math.round(size*0.38), dotY2=(y|0)+Math.round(size*0.82), c=palIdx(ramp,shades[3]);
        for(const dy of [dotY1,dotY2]){ if(opts.shadow!==false){eng.px(cx+2,dy+1,240);eng.px(cx+3,dy+1,240);}
          eng.px(cx+1,dy,c); eng.px(cx+2,dy,c); eng.px(cx+1,dy+1,c); eng.px(cx+2,dy+1,c); }
        cx+=5; continue;
      }
      const gl=gs[ch]||gs[FALLBACK[ch]]||gs['?']; if(!gl){cx+=4;continue;}
      for(let gy=0;gy<gl.h;gy++)for(let gx=0;gx<gl.w;gx++){
        const lv=gl.data[gy*gl.w+gx]; if(!lv) continue;
        const sx=cx+gx, sy=(y|0)+gy;
        if(opts.shadow!==false) eng.px(sx+1,sy+1,240);
        eng.px(sx,sy,palIdx(ramp,shades[lv]));
      }
      cx+=gl.adv;
    }
    return cx-x;
  };
  Art.font=font;
};

// ---------- carved stone UI ----------
// helper: carved stone fill with beveled edges into an arbitrary painter
function stonePix(x,y,N){ return 5+(N(x/7,y/7)*3|0)+(N(x/2.3,y/2.3)>0.85?-2:0); }
Art.bakeUI=function(){
  const N=makeNoise('ui1',32), N2=makeNoise('ui2',16);
  // full-screen frame: stone everywhere except viewport hole
  Art.ui.frame=bakePix(SCREEN_W,SCREEN_H,(x,y)=>{
    const inVP=x>=VP.x&&x<VP.x+VP.w&&y>=VP.y&&y<VP.y+VP.h;
    if(inVP) return 0;
    // beveled viewport rim
    const rim=(x>=VP.x-3&&x<VP.x+VP.w+3&&y>=VP.y-3&&y<VP.y+VP.h+3);
    let s=stonePix(x,y,N);
    if(rim){ const d=Math.min(x-(VP.x-3),(VP.x+VP.w+2)-x,y-(VP.y-3),(VP.y+VP.h+2)-y); s=d===0?9:d===1?2:5; }
    // outer screen border highlight
    if(x<2||y<2) s+=3; if(x>=SCREEN_W-2||y>=SCREEN_H-2) s-=2;
    // carved block seams
    const seam=((x%80<1&&y>VP.y+VP.h)||(y%60<1&&(x<VP.x||x>=VP.x+VP.w)&&y<VP.y+VP.h));
    if(seam) s-=3;
    return palIdx(0,clamp(s,1,13));
  });
  // parchment full-screen for menu screens
  Art.ui.parchment=bakePix(SCREEN_W,SCREEN_H,(x,y)=>{
    const border=x<10||y<10||x>=SCREEN_W-10||y>=SCREEN_H-10;
    if(border) return palIdx(0,stonePix(x,y,N));
    const n=N(x/9,y/9), stain=N2(x/16,y/16);
    let s=11+n*2-(stain>0.75?2:0);
    if(x<14||y<14||x>=SCREEN_W-14||y>=SCREEN_H-14) s-=3;
    return palIdx(1,clamp(s,4,13));
  });
  // portrait slot 62x70 (frame for 58x66 portrait)
  Art.ui.slot=bakePix(62,70,(x,y)=>{
    const d=Math.min(x,61-x,y,69-y);
    if(d<2) return palIdx(5,d===0?4:8);
    return 0;
  });
  Art.ui.barTex=bakePix(8,8,(x,y)=>palIdx(0,4+(N(x/3,y/3)*3|0)));
};

// ---------- title vista (lazy-baked painted scene) ----------
Art.title=function(){
  if(this._title) return this._title;
  const W=SCREEN_W,H=SCREEN_H;
  const N=makeNoise('title',32);
  const sky=Art.sky(20*60); // dusk
  const ridge=x=>300+Math.sin(x*0.008+1)*22+Math.sin(x*0.031)*9+N(x/40,3)*14;
  // keep silhouette: towers with battlements + lit windows
  const towers=[[150,258,26],[205,215,34],[320,180,44],[430,222,30],[492,262,22]];
  const inTower=(x,y)=>{
    for(const [tx,ty,tw] of towers){
      if(x>=tx-tw&&x<tx+tw&&y>=ty){
        const bat=y<ty+8&&(((x-tx+tw)/9|0)%2===0);
        if(y<ty+8&&!bat) continue;
        return {ty,tx,tw};
      }
    }
    if(y>340&&x>90&&x<560&&y>340+N(x/30,7)*12) return {ty:340,tx:x,tw:600}; // curtain wall
    return null;
  };
  const winlit=(x,y)=>{
    for(const [tx,ty,tw] of towers){
      const wx=(x-tx+tw), wy=y-ty;
      if(wx>4&&wx<tw*2-4&&wy>18&&((wx%14>5&&wx%14<9)&&(wy%26>8&&wy%26<15))) return ((tx*7+((wx/14)|0)*13+((wy/26)|0)*31)%10)<4;
    }
    return false;
  };
  this._title=bakePix(W,H,(x,y)=>{
    const r=ridge(x);
    const t=inTower(x,y);
    if(t){
      if(winlit(x,y)) return palIdx(5,10+((x+y)%3));
      const sh=2+N(x/9,y/9)*2.2+(y-t.ty<3?1.5:0);
      return palIdx(11,clamp(sh,1,5)|0);
    }
    if(y<r){ // sky
      const sy=clamp(y/r*sky.h|0,0,sky.h-1);
      return sky.tex[sy*sky.w+((x*1.6)|0)%sky.w];
    }
    if(y<r+40){ // far ridge
      return palIdx(6,2+((y-r)/14|0)+(N(x/16,y/16)>0.6?1:0));
    }
    // foreground meadow + road
    const road=Math.abs(x-320)<(y-r-40)*0.55+8;
    if(road&&y>360) return palIdx(1,4+(N(x/6,y/6)*3|0));
    return palIdx(13,1+clamp((y-r-40)/60,0,3)+(N(x/7,y/7)*2.5|0));
  });
  return this._title;
};

// carved stone button drawn directly to engine (dynamic labels)
function drawButton(eng,x,y,w,h,label,opts){
  const down=opts&&opts.down, size=(opts&&opts.size)||11, ramp=opts&&opts.ramp!==undefined?opts.ramp:5;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const d=Math.min(i,w-1-i,j,h-1-j);
    let s=6+((i*7+j*13)%5>2?1:0);
    if(d===0) s=down?9:2; else if(d===1) s=down? (i<w-2&&j<h-2?3:8):(i>1&&j>1?8:3);
    else if(down) s-=1;
    eng.px(x+i,y+j,palIdx(0,clamp(s,1,13)));
  }
  eng.textC(label,x+w/2|0,y+(h-size)/2|0,{size,ramp,bright:!down});
}

// ===== 06b_sprites.js =====
// 06b_sprites — creature sprites, NPCs, decor, item icons, portraits, paperdolls.
// Pre-rendered 1998 look: painted with gradients at 2x, downsampled, palette-dithered.
'use strict';

// ---------- painting helpers ----------
function vol(g,x,y,rx,ry,color,opts){ // shaded ellipse, light from top-left
  const o=opts||{};
  const grad=g.createRadialGradient(x-rx*0.35,y-ry*0.4,Math.min(rx,ry)*0.1,x,y,Math.max(rx,ry)*1.15);
  grad.addColorStop(0,o.hi||lighten(color,50));
  grad.addColorStop(0.55,color);
  grad.addColorStop(1,o.lo||darken(color,60));
  g.fillStyle=grad;
  g.beginPath(); g.ellipse(x,y,rx,ry,o.rot||0,0,7); g.fill();
  if(!o.noline){ g.strokeStyle='rgba(10,8,6,0.55)'; g.lineWidth=1; g.stroke(); }
}
function limb(g,x1,y1,x2,y2,wd,color){
  g.strokeStyle=color; g.lineWidth=wd; g.lineCap='round';
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  g.strokeStyle='rgba(10,8,6,0.35)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(x1+wd*0.4,y1); g.lineTo(x2+wd*0.4,y2); g.stroke();
}
function hex2(c){ // '#rgb' or '#rrggbb' -> [r,g,b]
  if(c.length===4) return [parseInt(c[1],16)*17,parseInt(c[2],16)*17,parseInt(c[3],16)*17];
  return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
}
function rgbs(r,g,b){ return 'rgb('+clamp(r|0,0,255)+','+clamp(g|0,0,255)+','+clamp(b|0,0,255)+')'; }
function lighten(c,k){ const[r,g,b]=hex2(c); return rgbs(r+k,g+k,b+k*0.8); }
function darken(c,k){ const[r,g,b]=hex2(c); return rgbs(r-k,g-k,b-k); }
function shadowBlob(g,x,y,rx,ry){ g.fillStyle='rgba(0,0,0,0.42)'; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,7); g.fill(); }
function bloodPool(g,x,y,rx,ry){ g.fillStyle='rgba(96,18,20,0.85)'; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,7); g.fill(); }

// weapons drawn in-hand
function drawWeapon(g,type,x,y,ang,len){
  g.save(); g.translate(x,y); g.rotate(ang);
  switch(type){
    case 'club': limb(g,0,0,0,-len,5,'#7a5a30'); vol(g,0,-len,4,6,'#7a5a30',{noline:1}); break;
    case 'sword': limb(g,0,0,0,-len,3,'#c8ccd4'); limb(g,-5,-6,5,-6,3,'#9a7c34'); vol(g,0,2,2.5,3,'#6a5020',{noline:1}); break;
    case 'axe': limb(g,0,0,0,-len,3,'#7a5a30'); g.fillStyle='#b8bcc4'; g.beginPath(); g.moveTo(0,-len); g.quadraticCurveTo(12,-len+2,10,-len+12); g.lineTo(0,-len+8); g.fill(); break;
    case 'staff': limb(g,0,6,0,-len,3,'#5a4020'); vol(g,0,-len,4,4,'#40c0c8',{noline:1}); break;
    case 'bow': g.strokeStyle='#7a5a30'; g.lineWidth=3; g.beginPath(); g.arc(0,-len*0.4,len*0.55,-1.3,1.3); g.stroke();
      g.strokeStyle='#d8d4c0'; g.lineWidth=1; g.beginPath(); g.moveTo(len*0.55*Math.cos(-1.3),-len*0.4+len*0.55*Math.sin(-1.3)); g.lineTo(len*0.55*Math.cos(1.3),-len*0.4+len*0.55*Math.sin(1.3)); g.stroke(); break;
    case 'dagger': limb(g,0,0,0,-len*0.6,2.5,'#c8ccd4'); limb(g,-3,-4,3,-4,2,'#9a7c34'); break;
  }
  g.restore();
}

// ---------- humanoid rig (64x96) ----------
function drawHumanoid(g,W,H,frame,p){
  const cx=W/2, groundY=H-6;
  const s=(p.size||1)*1.18;                 // bulked rig: monsters must own the frame
  const hipY=groundY-34*s, chestY=hipY-18*s, headY=chestY-16*s, headR=9*s*(p.headR||1);
  if(frame==='corpse'){
    bloodPool(g,cx,groundY-2,20*s,5*s);
    vol(g,cx,groundY-7,17*s,6*s,p.cloth); // torso lying
    vol(g,cx+15*s,groundY-6,5.5*s,5*s,p.skin); // head
    limb(g,cx-8*s,groundY-6,cx-20*s,groundY-2,4*s,p.skin); // arm out
    limb(g,cx-12*s,groundY-4,cx-24*s,groundY-8,4*s,p.cloth2||p.cloth); // leg
    if(p.weapon) drawWeapon(g,p.weapon,cx+8*s,groundY-2,1.35,16*s);
    return;
  }
  shadowBlob(g,cx,groundY,15*s,4);
  const walk=frame==='walk'?5*s:0;
  // legs
  limb(g,cx-4.5*s,hipY,cx-6*s-walk*0.6,groundY,6.5*s,p.legs||p.cloth2||'#4a3620');
  limb(g,cx+4.5*s,hipY,cx+6*s+walk*0.6,groundY,6.5*s,darken(p.legs||p.cloth2||'#4a3620',20));
  // torso (broad shoulders taper to hip)
  vol(g,cx,chestY+9*s,12*s*(p.bulk||1),16*s,p.cloth);
  vol(g,cx,chestY+2*s,12.5*s*(p.bulk||1),7*s,lighten(p.cloth,8),{noline:1}); // shoulder mass
  if(p.tabard){ g.fillStyle=p.tabard; g.fillRect(cx-5*s,chestY-2*s,10*s,24*s); }
  if(p.belt){ g.fillStyle='#3a2a14'; g.fillRect(cx-10*s,hipY-4*s,20*s,3.5*s); }
  // off arm / shield
  if(p.shield){ limb(g,cx-11*s,chestY+4*s,cx-16*s,chestY+13*s,5*s,p.skin); vol(g,cx-17*s,chestY+13*s,8.5*s,11*s,p.shieldCol||'#7a5a30'); }
  else limb(g,cx-11*s,chestY+4*s,cx-15*s,chestY+18*s,5*s,p.sleeves||p.skin);
  // weapon arm
  const atk=frame==='attack';
  const ax=cx+11*s, ay=chestY+4*s;
  const hx=atk?cx+16*s:cx+14*s, hy=atk?chestY-12*s:chestY+17*s;
  limb(g,ax,ay,hx,hy,5*s,p.sleeves||p.skin);
  if(p.weapon) drawWeapon(g,p.weapon,hx,hy,atk?0.5:0.15,(p.weapon==='staff'?28:p.weapon==='club'?15:20)*s);
  // head
  vol(g,cx,headY,headR,headR*1.12,p.skin);
  // face hint
  g.fillStyle='#181008';
  g.fillRect(cx-headR*0.45,headY-1,2,2); g.fillRect(cx+headR*0.2,headY-1,2,2);
  if(p.eyesGlow){ g.fillStyle=p.eyesGlow; g.fillRect(cx-headR*0.5,headY-1,2.6,2.6); g.fillRect(cx+headR*0.2,headY-1,2.6,2.6); }
  // headgear
  if(p.hood){ g.fillStyle=p.hood; g.beginPath(); g.arc(cx,headY-headR*0.15,headR*1.25,Math.PI*0.95,Math.PI*2.05); g.lineTo(cx+headR*1.1,headY+headR*0.9); g.lineTo(cx-headR*1.1,headY+headR*0.9); g.fill(); }
  if(p.helmet){ vol(g,cx,headY-headR*0.45,headR*1.05,headR*0.7,p.helmet,{noline:1}); if(p.plume){ g.strokeStyle=p.plume; g.lineWidth=3; g.beginPath(); g.moveTo(cx,headY-headR*1.1); g.quadraticCurveTo(cx+6,headY-headR*2.1,cx+11,headY-headR*1.4); g.stroke(); } }
  if(p.hair&&!p.helmet&&!p.hood){ g.fillStyle=p.hair; g.beginPath(); g.arc(cx,headY-headR*0.35,headR*0.95,Math.PI*0.9,Math.PI*2.1); g.fill(); }
  if(p.mask){ g.fillStyle='#e8e4d0'; g.fillRect(cx-headR*0.8,headY-headR*0.5,headR*1.6,headR*0.9); g.fillStyle='#181008'; g.fillRect(cx-headR*0.45,headY-2,2,3); g.fillRect(cx+headR*0.25,headY-2,2,3); }
  if(p.crown){ g.fillStyle='#e8c860'; g.beginPath(); const cy=headY-headR*0.9;
    g.moveTo(cx-headR,cy+3); g.lineTo(cx-headR,cy-3); g.lineTo(cx-headR*0.5,cy); g.lineTo(cx,cy-5); g.lineTo(cx+headR*0.5,cy); g.lineTo(cx+headR,cy-3); g.lineTo(cx+headR,cy+3); g.fill(); }
}

// ---------- specific monster painters ----------
function drawWolf(g,W,H,frame,p){
  const cx=W/2, gy=H-5, s=p.size||1;
  if(frame==='corpse'){ bloodPool(g,cx,gy-2,22*s,5*s); vol(g,cx,gy-8*s,20*s,7*s,p.fur); vol(g,cx-16*s,gy-9*s,7*s,5*s,p.fur); return; }
  shadowBlob(g,cx,gy,16*s,4);
  const lift=frame==='attack'?6*s:0, walk=frame==='walk'?3*s:0;
  // hind body then chest then head (front 3/4)
  vol(g,cx+6*s,gy-14*s,13*s,10*s,darken(p.fur,15));
  limb(g,cx+10*s,gy-10*s,cx+12*s+walk,gy,4*s,darken(p.fur,30));
  limb(g,cx-2*s,gy-10*s,cx-4*s-walk,gy-lift*0.4,4*s,darken(p.fur,25));
  vol(g,cx-4*s,gy-18*s-lift*0.4,11*s,9*s,p.fur);
  limb(g,cx-8*s,gy-12*s,cx-10*s+walk,gy-lift,4*s,p.fur);
  // head
  const hx=cx-10*s, hy=gy-26*s-lift;
  vol(g,hx,hy,8*s,7*s,p.fur);
  vol(g,hx-6*s,hy+3*s,5*s,3.5*s,darken(p.fur,10)); // snout
  if(frame==='attack'){ g.fillStyle='#a02428'; g.beginPath(); g.ellipse(hx-8*s,hy+4.5*s,3.5*s,2.2*s,0.3,0,7); g.fill();
    g.fillStyle='#e8e4d0'; g.fillRect(hx-10*s,hy+2.5*s,1.5,2); g.fillRect(hx-6*s,hy+2.5*s,1.5,2); }
  g.fillStyle='#181008'; g.beginPath(); g.ellipse(hx-9.5*s,hy+3*s,1.2*s,1.2*s,0,0,7); g.fill();
  g.fillStyle=p.eyes||'#d8b820'; g.fillRect(hx-2*s,hy-2*s,2.4,2); g.fillRect(hx+3*s,hy-2.5*s,2.4,2);
  // ears
  g.fillStyle=darken(p.fur,20);
  g.beginPath(); g.moveTo(hx-2*s,hy-6*s); g.lineTo(hx+1*s,hy-11*s); g.lineTo(hx+4*s,hy-6*s); g.fill();
  g.beginPath(); g.moveTo(hx+4*s,hy-5.5*s); g.lineTo(hx+7*s,hy-10*s); g.lineTo(hx+9*s,hy-5*s); g.fill();
  // tail
  g.strokeStyle=p.fur; g.lineWidth=3*s; g.beginPath(); g.moveTo(cx+17*s,gy-16*s); g.quadraticCurveTo(cx+24*s,gy-20*s,cx+22*s,gy-26*s); g.stroke();
}
function drawSkeleton(g,W,H,frame,p){
  const cx=W/2, gy=H-6, s=p.size||1, bone='#ddd6c0';
  if(frame==='corpse'){ // scattered bones
    g.strokeStyle=bone; g.lineWidth=3;
    for(const [a,b,c,d] of [[-16,-4,-6,-7],[2,-8,12,-4],[-8,-3,4,-5],[8,-9,18,-7]]) { g.beginPath(); g.moveTo(cx+a*s,gy+b*s); g.lineTo(cx+c*s,gy+d*s); g.stroke(); }
    vol(g,cx-2*s,gy-6*s,6*s,5*s,bone); g.fillStyle='#181008'; g.fillRect(cx-4*s,gy-7*s,2,2); g.fillRect(cx+1*s,gy-7*s,2,2);
    return;
  }
  shadowBlob(g,cx,gy,12*s,3.5);
  const walk=frame==='walk'?5*s:0, atk=frame==='attack';
  const hipY=gy-28*s, chestY=hipY-16*s, headY=chestY-13*s;
  // legs
  limb(g,cx-3*s,hipY,cx-5*s-walk*0.5,gy,3*s,bone); limb(g,cx+3*s,hipY,cx+5*s+walk*0.5,gy,3*s,bone);
  vol(g,cx,hipY,6*s,4*s,bone,{noline:1}); // pelvis
  // spine + ribs
  limb(g,cx,hipY,cx,chestY,2.5*s,bone);
  g.strokeStyle=bone; g.lineWidth=2;
  for(let i=0;i<4;i++){ const ry=chestY+3*s+i*3.4*s; g.beginPath(); g.arc(cx,ry,7*s-i*0.7*s,0.15*Math.PI,0.85*Math.PI); g.stroke(); g.beginPath(); g.arc(cx,ry,7*s-i*0.7*s,1.15*Math.PI,1.85*Math.PI); g.stroke(); }
  // arms
  limb(g,cx-7*s,chestY+3*s,cx-11*s,chestY+14*s,2.5*s,bone);
  const hx=atk?cx+12*s:cx+10*s, hy=atk?chestY-8*s:chestY+14*s;
  limb(g,cx+7*s,chestY+3*s,hx,hy,2.5*s,bone);
  if(p.weapon) drawWeapon(g,p.weapon,hx,hy,atk?0.5:0.2,16*s);
  if(p.shield){ vol(g,cx-13*s,chestY+13*s,6.5*s,8.5*s,'#5a6a78'); }
  // skull
  vol(g,cx,headY,7*s,7.5*s,bone);
  g.fillStyle='#100c08'; g.beginPath(); g.ellipse(cx-2.8*s,headY-1,2*s,2.4*s,0,0,7); g.fill();
  g.beginPath(); g.ellipse(cx+2.8*s,headY-1,2*s,2.4*s,0,0,7); g.fill();
  g.fillRect(cx-0.8*s,headY+2*s,1.6*s,2*s);
  g.strokeStyle='#8a8474'; g.lineWidth=1; g.beginPath(); g.moveTo(cx-4*s,headY+5.5*s); g.lineTo(cx+4*s,headY+5.5*s); g.stroke();
  if(p.helmet) vol(g,cx,headY-3*s,7.5*s,5*s,p.helmet,{noline:1});
  if(p.crown){ g.fillStyle='#e8c860'; const cy=headY-6*s; g.beginPath(); g.moveTo(cx-6*s,cy+3); g.lineTo(cx-6*s,cy-2); g.lineTo(cx-3*s,cy); g.lineTo(cx,cy-4); g.lineTo(cx+3*s,cy); g.lineTo(cx+6*s,cy-2); g.lineTo(cx+6*s,cy+3); g.fill(); }
  if(p.robe){ g.globalAlpha=0.85; vol(g,cx,chestY+14*s,11*s,18*s,p.robe,{noline:1}); g.globalAlpha=1; }
  if(p.eyesGlow){ g.fillStyle=p.eyesGlow; g.fillRect(cx-3.6*s,headY-1.5,2.6,2.6); g.fillRect(cx+1.8*s,headY-1.5,2.6,2.6); }
}
function drawGhost(g,W,H,frame){
  const cx=W/2, gy=H-4;
  const sway=frame==='walk'?3:0, atk=frame==='attack';
  if(frame==='corpse'){ g.globalAlpha=0.5; vol(g,cx,gy-6,14,4,'#9adbd8',{noline:1}); g.globalAlpha=1; return; }
  const grad=g.createLinearGradient(0,10,0,H);
  grad.addColorStop(0,'#e8fffb'); grad.addColorStop(0.5,'#7ab8b4'); grad.addColorStop(1,'rgba(60,90,90,0)');
  g.fillStyle=grad;
  g.beginPath();
  g.moveTo(cx-14,gy);
  g.quadraticCurveTo(cx-18+sway,H*0.45,cx-10,14);
  g.quadraticCurveTo(cx,4,cx+10,14);
  g.quadraticCurveTo(cx+18-sway,H*0.45,cx+14,gy);
  for(let i=0;i<4;i++) g.quadraticCurveTo(cx+10-i*7,gy-6,cx+7-i*7,gy);
  g.fill();
  g.fillStyle='#0c1a1a';
  g.beginPath(); g.ellipse(cx,20,7,8,0,0,7); g.fill();
  g.fillStyle=atk?'#ff5040':'#b0fff0';
  g.fillRect(cx-4,17,3,3); g.fillRect(cx+2,17,3,3);
  if(atk){ g.strokeStyle='#d0fff8'; g.lineWidth=2; g.beginPath(); g.moveTo(cx-14,34); g.lineTo(cx-22,28); g.stroke(); g.beginPath(); g.moveTo(cx+14,34); g.lineTo(cx+22,28); g.stroke(); }
}
function drawSpider(g,W,H,frame,p){
  const cx=W/2, gy=H-4, s=p.size||1;
  if(frame==='corpse'){ vol(g,cx,gy-5,12*s,5*s,'#3a3028'); g.strokeStyle='#3a3028'; g.lineWidth=2; for(let i=0;i<4;i++){ g.beginPath(); g.moveTo(cx-8*s+i*5*s,gy-6); g.lineTo(cx-14*s+i*7*s,gy-1); g.stroke(); } return; }
  shadowBlob(g,cx,gy,14*s,3.5);
  const lift=frame==='attack'?4:0, wob=frame==='walk'?2:0;
  g.strokeStyle='#2c241c'; g.lineWidth=2.5;
  for(let i=0;i<4;i++){
    const a=0.5+i*0.5, L=15*s;
    g.beginPath(); g.moveTo(cx-4*s,gy-12*s); g.quadraticCurveTo(cx-L*Math.cos(a)*0.8,gy-14*s-6*Math.sin(a)-wob,cx-L*Math.cos(a)-2,gy); g.stroke();
    g.beginPath(); g.moveTo(cx+4*s,gy-12*s); g.quadraticCurveTo(cx+L*Math.cos(a)*0.8,gy-14*s-6*Math.sin(a)+wob,cx+L*Math.cos(a)+2,gy); g.stroke();
  }
  vol(g,cx,gy-19*s-lift,9*s,7*s,'#463a2c'); // abdomen
  vol(g,cx,gy-11*s-lift*0.5,7*s,5.5*s,'#382e22'); // cephalothorax
  g.fillStyle='#c03028';
  for(let i=0;i<3;i++){ g.fillRect(cx-4*s+i*3*s,gy-13*s-lift*0.5,2,2); }
  if(frame==='attack'){ g.strokeStyle='#d8d4c0'; g.lineWidth=2; g.beginPath(); g.moveTo(cx-2*s,gy-8*s); g.lineTo(cx-3*s,gy-4*s); g.stroke(); g.beginPath(); g.moveTo(cx+2*s,gy-8*s); g.lineTo(cx+3*s,gy-4*s); g.stroke(); }
}
function drawBat(g,W,H,frame){
  const cx=W/2, cy=H*0.45;
  if(frame==='corpse'){ vol(g,cx,H-6,8,3,'#38302a'); return; }
  const up=frame!=='walk'; // wings flap between idle/walk frames
  g.fillStyle='#3a3028';
  const wy=up?-10:6;
  for(const dir of [-1,1]){
    g.beginPath(); g.moveTo(cx,cy);
    g.quadraticCurveTo(cx+dir*10,cy+wy*0.6,cx+dir*20,cy+wy);
    g.lineTo(cx+dir*16,cy+4); g.lineTo(cx+dir*10,cy+2); g.fill();
  }
  vol(g,cx,cy,5,6,'#4a3e32');
  g.fillStyle='#c03028'; g.fillRect(cx-2.5,cy-2,2,2); g.fillRect(cx+1,cy-2,2,2);
  g.fillStyle='#38302a'; g.beginPath(); g.moveTo(cx-3,cy-5); g.lineTo(cx-2,cy-9); g.lineTo(cx,cy-5); g.fill();
  g.beginPath(); g.moveTo(cx,cy-5); g.lineTo(cx+2,cy-9); g.lineTo(cx+3,cy-5); g.fill();
}

function drawTree(g,W,H,variant){
  const cx=W/2, gy=H-4;
  shadowBlob(g,cx,gy,20,5);
  limb(g,cx,gy,cx+(variant?3:-2),gy-30,8,'#5a4428');
  limb(g,cx,gy-22,cx-9,gy-38,4,'#4a3820'); limb(g,cx,gy-26,cx+10,gy-42,4,'#4a3820');
  const leaf=variant?'#4a7a34':'#3e6e40';
  // canopy: flat-shaded blob cluster (no radial rims — they read as rings)
  const blob=(x,y,rx,ry,c)=>{ g.fillStyle=c; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,7); g.fill(); };
  blob(cx,gy-52,26,22,darken(leaf,28));
  blob(cx-12,gy-44,15,12,leaf); blob(cx+11,gy-48,16,13,leaf);
  blob(cx+2,gy-60,17,13,leaf); blob(cx-6,gy-54,12,10,lighten(leaf,14));
  blob(cx+7,gy-56,9,8,lighten(leaf,26)); blob(cx-14,gy-50,7,6,lighten(leaf,20));
  // leaf speckle for texture
  for(let i=0;i<46;i++){ const a=i*2.4, r=(i*7919%23); const x=cx+Math.cos(a)*r, y=gy-52+Math.sin(a)*r*0.8;
    g.fillStyle=(i%3)?darken(leaf,14):lighten(leaf,30); g.fillRect(x,y,2,2); }
}

// ---------- portraits (58x66, painted at 2x) ----------
function paintFace(big,W2,H2,p){
  const g=big, cx=W2/2;
  // background
  const bg=g.createLinearGradient(0,0,0,H2); bg.addColorStop(0,p.bgTop||'#2a3444'); bg.addColorStop(1,p.bgBot||'#141a26');
  g.fillStyle=bg; g.fillRect(0,0,W2,H2);
  const skin=p.skin||'#d8a878';
  // shoulders / garment
  vol(g,cx,H2+10,W2*0.62,H2*0.42,p.garb||'#5a4a34',{noline:1});
  if(p.collar){ g.fillStyle=p.collar; g.fillRect(cx-W2*0.4,H2*0.82,W2*0.8,H2*0.08); }
  // neck
  vol(g,cx,H2*0.78,W2*0.14,H2*0.12,darken(skin,15),{noline:1});
  // head
  const hy=H2*0.44, hr=W2*0.30;
  vol(g,cx,hy,hr,hr*1.22,skin,{noline:1,hi:lighten(skin,40),lo:darken(skin,45)});
  // jaw shade
  g.fillStyle='rgba(60,30,16,0.18)'; g.beginPath(); g.ellipse(cx,hy+hr*0.75,hr*0.72,hr*0.4,0,0,7); g.fill();
  // hood/scarf frame the face — draw BEFORE features, with an inner face window
  if(p.head==='hood'||p.head==='scarf'){
    g.fillStyle=p.hoodC||(p.head==='hood'?'#2c3a6a':'#8a5a4a');
    g.beginPath(); g.arc(cx,hy-hr*0.1,hr*1.32,Math.PI*0.9,Math.PI*2.1);
    g.lineTo(cx+hr*1.2,H2); g.lineTo(cx-hr*1.2,H2); g.fill();
    vol(g,cx,hy+hr*0.06,hr*0.8,hr*0.98,skin,{noline:1,hi:lighten(skin,35),lo:darken(skin,40)});
    g.fillStyle='rgba(10,8,16,0.35)'; g.beginPath(); g.ellipse(cx,hy-hr*0.55,hr*0.7,hr*0.32,0,0,7); g.fill();
  }
  // eyes
  const ey=hy-hr*0.1, ex=hr*0.42;
  for(const d of [-1,1]){
    if(p.pain){ // squeezed shut
      g.strokeStyle='rgba(40,20,10,0.85)'; g.lineWidth=2.5;
      g.beginPath(); g.moveTo(cx+d*ex-hr*0.18,ey); g.quadraticCurveTo(cx+d*ex,ey+hr*0.08,cx+d*ex+hr*0.18,ey); g.stroke();
    } else {
      g.fillStyle='#e8e0d4'; g.beginPath(); g.ellipse(cx+d*ex,ey,hr*0.2,hr*0.12,0,0,7); g.fill();
      g.fillStyle=p.eyes||'#4a6a8a'; g.beginPath(); g.ellipse(cx+d*ex,ey,hr*0.09,hr*0.1,0,0,7); g.fill();
      g.fillStyle='#100c08'; g.beginPath(); g.ellipse(cx+d*ex,ey,hr*0.045,hr*0.05,0,0,7); g.fill();

    limb(g,cx-13,chestY+4,cx-17,chestY+34,7,skin); limb(g,cx+13,chestY+4,cx+17,chestY+34,7,darken(skin,12));
    vol(g,cx,headY,hr,hr*1.2,skin,{noline:1,hi:lighten(skin,35)});
    g.fillStyle=hairC; g.beginPath(); g.arc(cx,headY-hr*0.3,hr*0.95,Math.PI*0.95,Math.PI*2.05); g.fill();
    g.fillStyle='#181008'; g.fillRect(cx-5,headY-2,2.5,2.5); g.fillRect(cx+2,headY-2,2.5,2.5);
    g.strokeStyle='rgba(60,30,16,0.5)'; g.lineWidth=1.5; g.beginPath(); g.moveTo(cx,headY); g.lineTo(cx-1,headY+5); g.stroke();
    g.strokeStyle='rgba(90,30,25,0.8)'; g.lineWidth=2; g.beginPath(); g.moveTo(cx-3,headY+8); g.lineTo(cx+3,headY+8); g.stroke();
  },10);
  Art.paperdolls.male=base('#d0a070','#4a3828','#6a5a44');
